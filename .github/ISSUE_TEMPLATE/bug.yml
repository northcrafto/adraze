name: Bug
description: Something in the extension itself doesn't work
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: browser
    attributes:
      label: Browser and version
