<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'none'; connect-src 'none'; font-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Musgest</title>
<style>
  /* Anpassa › musgester: spåret medan man drar med höger musknapp. Genomskinlig vy ovanpå fliken
     (anpassa-kortkommandon.js visar den bara under en gest). Diskret: tunn orange linje med ljus kant, och en liten etikett vid pekaren. */
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; cursor: default; user-select: none; }
  svg { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .kant { fill: none; stroke: rgb(255 255 255 / .7); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  .linje { fill: none; stroke: #ff4b1f; stroke-width: 2.75; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
  .start { fill: #ff4b1f; stroke: #fff; stroke-width: 2; }
  #etikett { position: fixed; left: 0; top: 0; display: none; align-items: center; gap: 8px; padding: 6px 11px 6px 9px; border-radius: 9px;
    background: #1f1e1b; color: #fff; font: 600 12.5px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; white-space: nowrap;
    box-shadow: 0 6px 18px rgb(31 30 27 / .28), 0 1px 3px rgb(31 30 27 / .2); pointer-events: none; }
  #etikett.syns { display: inline-flex; }
  #pilar { font-weight: 700; letter-spacing: 1px; color: #ffb59f; }
</style>
</head>
<body>
<svg id="yta" aria-hidden="true"><polyline id="kant" class="kant" points="" /><polyline id="linje" class="linje" points="" /><circle id="start" class="start" r="0" cx="0" cy="0" /></svg>
<div id="etikett" role="status" translate="no"><span id="pilar"></span><span id="namn"></span></div>
<!-- Språk och dir=rtl (texten kommer färdigöversatt från huvudprocessen, därav translate="no" ovan) -->
<script src="i18n-popup.js"></script>
<script src="i18n.js"></script>
<script src="anpassa-gest.js"></script>
</body>
</html>
