<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: transparent; overflow: hidden;
    font-family: -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
  /* Nytt utseende (2026-11-18): en ren lista som i Chrome och Brave. Ingen färgad platta bakom ikonen, en ring runt
     ikonen visar hur långt nedladdningen kommit, och knapparna till höger syns när man pekar på raden. */
  :root { --yta: #fff; --kant: #e9e6e0; --text: #1f1e1b; --dov: #6f6d66; --svag: #a3a19a; --hover: #f5f3ee; --acc: #ff4b1f; --fara: #c8372d; --ring: #e6e3dc; }
  .card { margin: 8px 10px 16px 10px; background: var(--yta); border-radius: 14px; overflow: hidden;
    box-shadow: 0 18px 44px rgba(31,30,27,.26), 0 3px 10px rgba(31,30,27,.10);
    border: 1px solid var(--kant); animation: pop .16s cubic-bezier(.2,.8,.2,1); transform-origin: top right; }
  @keyframes pop { from { opacity: 0; transform: translateY(-8px) scale(.98); } to { opacity: 1; transform: none; } }
  .head { display: flex; align-items: center; justify-content: space-between; padding: 12px 8px 8px 16px; }
  .head h1 { font-size: 13px; font-weight: 650; color: var(--text); margin: 0; letter-spacing: -.005em; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .x { border: 0; background: transparent; cursor: pointer; color: var(--dov); width: 28px; height: 28px;
    border-radius: 50%; display: grid; place-items: center; font-size: 18px; line-height: 1; }
  .x:hover { background: var(--hover); color: var(--text); }
  .list { max-height: 380px; overflow-y: auto; padding: 2px 6px 6px; }
  .empty { padding: 26px 16px 30px; text-align: center; color: var(--svag); font-size: 13px; }
  .row { display: flex; gap: 12px; align-items: center; padding: 9px 10px; border-radius: 10px; cursor: default; }
  .row:hover { background: var(--hover); }
  .row.open { cursor: pointer; }
  .ico { position: relative; flex: none; width: 36px; height: 36px; display: grid; place-items: center; color: var(--dov); }
  .ico > svg:not(.ring) { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .ico.warn { color: var(--fara); }
  .ico.gar > svg:not(.ring) { width: 15px; height: 15px; stroke-width: 2; color: var(--text); }
  .ring { position: absolute; inset: 0; width: 36px; height: 36px; transform: rotate(-90deg); fill: none; stroke-width: 2.6; stroke-linecap: round; }
  .ring .rb { stroke: var(--ring); }
  .ring .rf { stroke: var(--acc); transition: stroke-dasharray .25s ease; }
  .ring.ob { animation: spin .9s linear infinite; }
  .ring.vila .rf { stroke: var(--svag); }
  .meta { flex: 1; min-width: 0; }
  .name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 11.5px; color: var(--dov); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .sub.warn { color: var(--fara); font-weight: 600; }
  .fbtn { flex: none; border: 0; background: transparent; cursor: pointer; color: var(--dov);
    width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; opacity: 0; transition: opacity .12s; }
  .row:hover .fbtn, .row.aktiv .fbtn, .fbtn:focus-visible { opacity: 1; }
  .fbtn:hover { background: color-mix(in srgb, var(--text) 9%, transparent); color: var(--text); }
  .fbtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .fot { border-top: 1px solid var(--kant); padding: 4px 6px; }
  .alla { display: flex; align-items: center; justify-content: space-between; width: 100%; border: 0; background: transparent; cursor: pointer; padding: 9px 10px; border-radius: 10px; font: inherit; font-size: 12.5px; font-weight: 600; color: var(--text); }
  .alla:hover { background: var(--hover); }
  .alla svg { width: 15px; height: 15px; fill: none; stroke: var(--dov); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  :root[data-theme="dark"] { --yta: #1e1c19; --kant: #2e2c29; --text: #eeede8; --dov: #a2a097; --svag: #77756d; --hover: rgba(255,255,255,.06); --fara: #ff8a7a; --ring: #34322e; }
  :root[data-theme="dark"] .card { box-shadow: 0 18px 44px rgba(0,0,0,.5), 0 3px 10px rgba(0,0,0,.3); }
  :root[data-theme="dark"] .list { scrollbar-color: #3f3e3a transparent; }
  :root[data-theme="dark"][data-palett="jul"] { --yta: #132e21; --kant: #214a35; --text: #f4ecd8; --dov: #a9b8a6; --svag: #7d927f; --hover: rgba(244,236,216,.08); --ring: #214a35; }
</style>
<script>
  // Tema: skalet sparar skoll-theme i localStorage (samma file://-origin) → följ det, även om det byts medan rutan är öppen
  (function () {
    function tema() { try { document.documentElement.dataset.theme = localStorage.getItem('skoll-theme') === 'dark' ? 'dark' : 'light'; } catch (e) {} }
    tema(); window.addEventListener('storage', function (e) { if (!e.key || e.key === 'skoll-theme') tema(); });
    try { if (new URLSearchParams(location.search).get('palett') === 'jul') document.documentElement.dataset.palett = 'jul'; } catch (e) {}
  })();
</script>
<script>
/* Fokusringen (orange ram) visas bara när du använder tangentbordet (Tab/piltangenter).
   Efter musklick, eller när en ruta stängs och fokus hoppar tillbaka till en knapp, syns ingen ram. */
(function () {
  const root = document.documentElement;
  const st = document.createElement('style');
  st.textContent = 'html:not([data-kbd]) :focus, html:not([data-kbd]) :focus-visible { outline: none !important; }'
    + ' html:not([data-kbd]) button:focus, html:not([data-kbd]) a:focus, html:not([data-kbd]) [role="button"]:focus, html:not([data-kbd]) .switch input:focus + .track { box-shadow: none; }';
  (document.head || root).appendChild(st);
  const NAV = new Set(['Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Home', 'End', 'PageUp', 'PageDown']);
  addEventListener('keydown', (e) => { if (NAV.has(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey) root.setAttribute('data-kbd', ''); }, true);
  addEventListener('pointerdown', () => root.removeAttribute('data-kbd'), true);
})();
</script>
</head>
<body>
  <div class="card">
    <div class="head">
      <h1>Nedladdningar</h1>
      <button class="x" id="close" title="Stäng">&times;</button>
    </div>
    <div class="list" id="list"><div class="empty">Inga nedladdningar än.</div></div>
    <div class="fot"><button class="alla" id="alla" type="button"><span>Alla nedladdningar</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></div>
  </div>
  <script>
    // Översättning: samma ordlista som skalet (adraze-lang i localStorage delas, samma file://-origin).
    window.locale = { load: (l) => { try { return window.adrazeIpc.sendSync('i18n:load', l) || {}; } catch (e) { return {}; } } };
  </script>
  <script src="i18n.js"></script>
  <script>
    const ipcRenderer = window.adrazeIpc;
    const list = document.getElementById('list');
    let hovered = false, idleTimer = null, data = [];

    const ICO_DL = '<svg viewBox="0 0 24 24"><path d="M12 4v10M8 10l4 4 4-4"/><path d="M5 19h14"/></svg>';
    const ICO_DOC = '<svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg>';
    const ICO_WARN = '<svg viewBox="0 0 24 24"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.5"/></svg>';
    const ICO_NER = '<svg viewBox="0 0 24 24"><path d="M12 5v13M6.5 12.5 12 18l5.5-5.5"/></svg>';
    const ICO_PAUSE = '<svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>';
    const ICO_PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
    const ICO_X = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    const ICO_FOLDER = '<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';

    const LANG = (window.i18n && window.i18n.lang) || 'sv';
    function fmt(n) { if (!n) return '0 B'; const u = ['B','KB','MB','GB']; let i = 0;
      while (n >= 1024 && i < 3) { n /= 1024; i++; }
      let v; try { v = new Intl.NumberFormat(LANG, { minimumFractionDigits: i ? 1 : 0, maximumFractionDigits: i ? 1 : 0, useGrouping: false }).format(n); } catch (e) { v = n.toFixed(i ? 1 : 0); }
      return v + ' ' + u[i]; }
    // dynamiska strängar: svenska = nyckel; {platshållare} fylls i efter översättningen
    const t = (s, v) => (window.t ? window.t(s, v) : (v ? s.replace(/\{([a-z]\w*)\}/g, (m, k) => (v[k] != null ? String(v[k]) : m)) : s));
    function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }

    function render() {
      list.innerHTML = '';
      if (!data.length) { list.innerHTML = '<div class="empty">Inga nedladdningar än.</div>'; return; }
      data.forEach((d) => {
        const paused = d.state === 'paused';
        const prog = d.state === 'progressing' || paused, scan = d.state === 'scanning';
        const infected = d.state === 'infected', removed = d.state === 'deleted';
        const done = d.state === 'completed';
        const failed = d.state === 'cancelled' || d.state === 'interrupted';
        const row = document.createElement('div');
        row.className = 'row' + (done ? ' open' : '') + (prog ? ' aktiv' : '');

        let icoCls = 'ico', ico = ICO_DOC, sub = '', subCls = 'sub', pct = 0;
        const ring = (p, cls) => '<svg class="ring ' + (cls || '') + '" viewBox="0 0 36 36" aria-hidden="true"><circle class="rb" cx="18" cy="18" r="16"/><circle class="rf" cx="18" cy="18" r="16" pathLength="100" stroke-dasharray="' + p + ' 100"/></svg>';
        if (prog) {
          pct = d.total > 0 ? Math.round(d.received / d.total * 100) : 0;
          sub = d.total > 0 ? (fmt(d.received) + ' / ' + fmt(d.total) + ' · ' + pct + '%') : t('{storlek} hämtat…', { storlek: fmt(d.received) });
          icoCls = 'ico gar';
          ico = (d.total > 0 ? ring(Math.max(pct, 2), paused ? 'vila' : '') : ring(26, 'ob')) + (paused ? ICO_PAUSE : ICO_NER);
          if (paused) sub = t('Pausad') + ' · ' + sub;
        } else if (scan) { sub = t('Skannar efter virus…'); icoCls = 'ico gar'; ico = ring(26, 'ob') + ICO_DOC; }
        else if (infected) { icoCls = 'ico warn'; ico = ICO_WARN; subCls = 'sub warn'; sub = t('Blockerad: {hot}', { hot: d.threat || t('hot') }); }
        else if (removed) { icoCls = 'ico warn'; ico = ICO_WARN; subCls = 'sub warn'; sub = t('Borttagen (virus)'); }
        else if (done) {
          sub = (d.total > 0 ? fmt(d.total) + ' · ' : '') + (d.scan === 'overridden' ? t('Klar (behållen)') : (d.scan === 'clean' ? t('Ingen känd skadlig fil') : t('Klar'))); }
        else if (failed) { sub = d.state === 'cancelled' ? t('Avbruten') : t('Misslyckades'); }

        row.innerHTML =
          '<span class="' + icoCls + '">' + ico + '</span>' +
          '<div class="meta"><div class="name" translate="no">' + esc(d.filename) + '</div>' +
          '<div class="' + subCls + '">' + esc(sub) + '</div>' +
          '</div>' +
          (done ? '<button class="fbtn" title="' + esc(t('Visa i mapp')) + '" data-folder="' + d.id + '">' + ICO_FOLDER + '</button>' : '') +
          (prog ? '<button class="fbtn" title="' + esc(paused ? t('Fortsätt') : t('Pausa')) + '" data-toggle="' + d.id + '">' + (paused ? ICO_PLAY : ICO_PAUSE) + '</button><button class="fbtn" title="' + esc(t('Avbryt')) + '" data-cancel="' + d.id + '">' + ICO_X + '</button>' : '');

        if (done) row.addEventListener('click', (ev) => {
          if (ev.target.closest('[data-folder]')) return;
          ipcRenderer.send('dl:open', d.id);
        });
        const tb = row.querySelector('[data-toggle]');
        if (tb) tb.addEventListener('click', (ev) => { ev.stopPropagation(); ipcRenderer.send(paused ? 'dl:resume' : 'dl:pause', d.id); });
        const cb = row.querySelector('[data-cancel]');
        if (cb) cb.addEventListener('click', (ev) => { ev.stopPropagation(); ipcRenderer.send('dl:cancel', d.id); });
        const fb = row.querySelector('[data-folder]');
        if (fb) fb.addEventListener('click', (ev) => { ev.stopPropagation(); ipcRenderer.send('dl:folder', d.id); });
        list.appendChild(row);
      });
    }

    function scheduleIdleClose() {
      clearTimeout(idleTimer);
      const anyActive = data.some((d) => d.state === 'progressing' || d.state === 'paused' || d.state === 'scanning');
      if (anyActive || hovered) return;
      idleTimer = setTimeout(() => ipcRenderer.send('dl:popup-close'), 6000);
    }

    // Rapportera kortets höjd → huvudprocessen krymper vyn till innehållet (ingen osynlig klick-döda-zon).
    function reportSize() { try { const c = document.querySelector('.card'); if (c) ipcRenderer.send('dl:popup-size', Math.ceil(c.getBoundingClientRect().bottom) + 16); } catch (e) {} }
    ipcRenderer.on('dl-data', (_e, arr) => { data = Array.isArray(arr) ? arr : []; render(); reportSize(); scheduleIdleClose(); });
    document.getElementById('close').onclick = () => ipcRenderer.send('dl:popup-close');
    document.getElementById('alla').onclick = () => ipcRenderer.send('dl:show-all');
    document.body.addEventListener('mouseenter', () => { hovered = true; clearTimeout(idleTimer); }, true);
    document.body.addEventListener('mouseleave', () => { hovered = false; scheduleIdleClose(); }, true);
  </script>
</body>
</html>
