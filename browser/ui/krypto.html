<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Falk</title>
<style>
  /* Falk-chatten. Samma tokens som Pro-rutan, kassan och inställningarna i mörkt läge.
     Falks svar är löptext utan bubbla; bara dina egna meddelanden ligger i en bubbla. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #0e0e10; --surface: #161618; --surface-2: #1d1d20; --line: #26262a; --field-line: #34343a; --ink: #f2f2f4; --mut: #a1a1a8; --faint: #6f6f76;
    --accent: #ff4b1f; --accent-ink: #ff7a52; --accent-soft: rgb(255 75 31 / .12);
    /* gamla namn som skriptet fortfarande använder i inline-stilar */
    --terra: var(--accent-ink); --dim: var(--mut); --card: var(--surface); --card-2: var(--surface-2); }
  html, body { height: 100%; }
  body { font-family: Inter, -apple-system, "Segoe UI", Roboto, system-ui, sans-serif; color: var(--ink); background: var(--bg);
    display: flex; flex-direction: column; height: 100%; overflow: hidden; -webkit-font-smoothing: antialiased; }

  /* Huvud */
  header { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 10px 0 14px; border-bottom: 1px solid var(--line); background: var(--bg); position: relative; z-index: 5; }
  header .dot { width: 24px; height: 24px; display: grid; place-items: center; flex: none; }
  .owl { display: block; width: 22px; height: 22px; object-fit: contain; }
  body.thinking header .owl { animation: falk-pulse 1.4s ease-in-out infinite; }
  @keyframes falk-pulse { 50% { opacity: .45; } }
  header .t { font-weight: 650; font-size: 14px; overflow: hidden; line-height: 1.2; }
  header .t small { display: block; font-weight: 500; font-size: 11.5px; color: var(--mut); white-space: nowrap; text-overflow: ellipsis; overflow: hidden; max-width: 170px; }
  header .t small.live { color: var(--ink); opacity: .78; }
  header .grow { flex: 1; }
  .hbtn { position: relative; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; cursor: pointer; color: var(--mut); background: transparent; border: 0; transition: background .15s, color .15s; }
  .hbtn:hover { background: rgb(255 255 255 / .06); color: var(--ink); }
  .hbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hbtn svg { width: 17px; height: 17px; }
  .hbtn .badge { position: absolute; top: 3px; right: 3px; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 7px; background: var(--accent); color: #fff;
    font-size: 9px; font-weight: 700; display: none; align-items: center; justify-content: center; line-height: 14px; }
  .hbtn .badge.on { display: flex; }

  /* Samtalet */
  #log { flex: 1; overflow-y: auto; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 18px; }
  #log > * { flex: 0 0 auto; }   /* annars krymper flex-barnen när loggen svämmar över → sista kortet klipps */
  .msg { display: flex; gap: 10px; max-width: 100%; animation: msgin .2s ease-out both; }
  @keyframes msgin { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .msg .av { flex: 0 0 auto; width: 22px; height: 22px; margin-top: 1px; display: grid; place-items: center; }
  .msg .av .owl { width: 20px; height: 20px; }
  .msg .bubble { font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; min-width: 0; }
  .msg.krypto .bubble { color: #e6e6ea; padding-top: 1px; }
  .msg.user { justify-content: flex-end; }
  .msg.user .av { display: none; }
  .msg.user .bubble { max-width: 85%; padding: 9px 13px; border-radius: 14px 14px 4px 14px; background: var(--surface-2); color: var(--ink); }
  .typing .bubble { color: var(--mut); }
  .think { display: inline-flex; align-items: center; gap: 8px; color: var(--mut); font-size: 13.5px; }
  .think .tt::after { content: ""; display: inline-block; width: 18px; text-align: left; animation: falk-dots 1.2s steps(4) infinite; }
  @keyframes falk-dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  .dots span { display: inline-block; width: 5px; height: 5px; margin: 0 1.5px; border-radius: 50%; background: var(--mut); animation: b 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: .18s; } .dots span:nth-child(3) { animation-delay: .36s; }
  @keyframes b { 0%,60%,100% { opacity: .3; } 30% { opacity: 1; } }

  /* Välkomstvyn när samtalet är tomt */
  .hero { display: flex; flex-direction: column; align-items: flex-start; padding: 18px 2px 4px; gap: 6px; animation: msgin .25s ease-out both; }
  .hero .big { width: 40px; height: 40px; margin-bottom: 10px; }
  .hero .big img { width: 40px; height: 40px; object-fit: contain; }
  .hero h1 { font-size: 22px; font-weight: 700; letter-spacing: -.025em; }
  .hero p { font-size: 13.5px; color: var(--mut); max-width: 38ch; line-height: 1.55; }
  .sugg { display: flex; flex-direction: column; width: 100%; margin-top: 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
  .sugg button { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; padding: 12px 14px; text-align: left; font: inherit; font-size: 13.5px;
    color: var(--ink); background: transparent; border: 0; cursor: pointer; transition: background .15s; }
  .sugg button + button { border-top: 1px solid var(--line); }
  .sugg button:hover { background: rgb(255 255 255 / .03); }
  .sugg button span { order: 2; color: var(--faint); font-size: 16px; line-height: 1; transition: color .15s, transform .2s; }
  .sugg button:hover span { color: var(--accent); transform: translateX(2px); }

  /* Det Falk gör (sparar minnen, öppnar saker): en lugn grå rad med ikon, ingen ruta */
  .step { align-self: flex-start; display: inline-flex; align-items: center; gap: 7px; max-width: 100%; padding: 2px 0; border: 0; background: none;
    font: inherit; font-size: 12.5px; line-height: 1.4; color: var(--mut); text-align: left; animation: msgin .25s ease-out both; }
  .step svg { flex: none; width: 15px; height: 15px; color: var(--mut); }
  .step b { font-weight: 550; color: var(--ink); opacity: .82; }
  .step .sv { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step.del .sv { text-decoration: line-through; }
  button.step { cursor: pointer; }
  button.step:hover b { opacity: 1; text-decoration: underline; text-underline-offset: 3px; }
  .step.run b::after { content: ""; display: inline-block; width: 14px; text-align: left; animation: falk-dots 1.2s steps(4) infinite; }
  .steps { align-self: stretch; display: flex; flex-direction: column; gap: 2px; }
  .recall { align-self: flex-start; display: inline-flex; gap: 6px; align-items: center; font-size: 11.5px; font-weight: 600; color: var(--mut);
    padding: 3px 10px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
  .recall svg { color: var(--accent-ink); width: 13px; height: 13px; }

  /* Paneler: samtal och minne */
  .panel { position: absolute; inset: 0; top: 52px; background: var(--bg); z-index: 8; display: none; flex-direction: column; }
  .panel.on { display: flex; }
  .panel .p-head { padding: 14px 10px 12px 16px; display: flex; align-items: center; gap: 8px; }
  .panel .p-head .t { font-weight: 700; font-size: 17px; letter-spacing: -.015em; }
  .panel .p-head .sub { font-size: 12.5px; color: var(--mut); margin-top: 2px; }
  .p-list { flex: 1; overflow-y: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; }
  .p-empty { color: var(--mut); font-size: 13px; padding: 24px 2px; line-height: 1.55; }
  .mprow, .convrow { display: flex; gap: 10px; align-items: center; padding: 11px 12px; background: var(--surface); border: 1px solid var(--line); border-top-width: 0; font-size: 13.5px; }
  .mprow:first-child, .convrow:first-child { border-top-width: 1px; border-radius: 12px 12px 0 0; }
  .mprow:last-child, .convrow:last-child { border-radius: 0 0 12px 12px; }
  .mprow:only-child, .convrow:only-child { border-radius: 12px; }
  .mprow .mv { flex: 1; line-height: 1.45; outline: none; padding: 2px 4px; border-radius: 6px; }
  .mprow .mv[contenteditable="true"] { background: var(--bg); box-shadow: inset 0 0 0 1px var(--field-line); cursor: text; }
  .mprow .ib, .convrow .del { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 7px; border: 0; cursor: pointer; background: transparent; color: var(--faint); display: grid; place-items: center; transition: background .15s, color .15s; }
  .mprow .ib:hover, .convrow .del:hover { background: rgb(255 255 255 / .06); color: var(--ink); }
  .mprow .ib.del:hover, .convrow .del:hover { color: #ff8a7a; }
  .mprow.leaving { animation: memout .3s ease-in forwards; }
  .convrow { cursor: pointer; transition: background .15s; }
  .convrow:hover { background: var(--surface-2); }
  .convrow.active { box-shadow: inset 2px 0 0 var(--accent); }
  .convrow .ci { display: none; }
  .convrow .cmeta { flex: 1; min-width: 0; }
  .convrow .ctitle { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .convrow .csub { font-size: 11.5px; color: var(--mut); margin-top: 1px; }
  .p-newbtn { margin: 0 16px 12px; display: flex; align-items: center; justify-content: center; gap: 8px; height: 40px; border-radius: 10px; cursor: pointer; border: 0;
    font: inherit; font-size: 13.5px; font-weight: 600; color: var(--ink); background: transparent; box-shadow: inset 0 0 0 1px var(--field-line); transition: background .15s; }
  .p-newbtn:hover { background: var(--surface); }
  .mp-add { flex: 0 0 auto; padding: 12px 16px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
  .mp-add input { flex: 1; height: 40px; background: var(--surface); border: 1px solid var(--field-line); border-radius: 10px; padding: 0 12px; color: var(--ink); font: inherit; font-size: 13.5px; outline: none; }
  .mp-add input:focus { border-color: var(--ink); }
  .mp-add input::placeholder { color: var(--faint); }
  .mp-add button { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 10px; border: 0; cursor: pointer; background: var(--ink); color: #111; display: grid; place-items: center; }

  /* Skrivfältet */
  footer { flex: 0 0 auto; padding: 10px 14px 12px; background: var(--bg); position: relative; }
  #cmdhint { position: absolute; left: 14px; right: 14px; bottom: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: none; box-shadow: 0 16px 40px rgb(0 0 0 / .45); }
  #cmdhint.on { display: block; }
  .cmd { display: flex; align-items: center; gap: 10px; padding: 9px 12px; cursor: pointer; }
  .cmd + .cmd { border-top: 1px solid var(--line); }
  .cmd:hover, .cmd.sel { background: var(--surface-2); }
  .cmd .cname { font-weight: 600; color: var(--accent-ink); font-size: 12.5px; font-family: ui-monospace, monospace; }
  .cmd .cdesc { color: var(--mut); font-size: 12px; }
  .inwrap { display: flex; align-items: flex-end; gap: 8px; background: var(--surface); border: 1px solid var(--field-line); border-radius: 14px; padding: 8px 8px 8px 14px; transition: border-color .15s; }
  .inwrap:focus-within { border-color: #55555c; }
  #inp { flex: 1; background: transparent; border: 0; outline: none; color: var(--ink); font-size: 14px; line-height: 1.5; resize: none; max-height: 140px; font-family: inherit; padding: 4px 0; }
  #inp::placeholder { color: var(--faint); }
  #send { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 9px; border: 0; cursor: pointer; background: var(--ink); color: #111; display: grid; place-items: center; transition: background .15s, color .15s, opacity .15s; }
  #send:hover:not(:disabled) { background: var(--accent); color: #fff; }
  #send:disabled { opacity: .3; cursor: default; }
  #send:active:not(:disabled) { transform: translateY(1px); }
  #send svg { width: 16px; height: 16px; }
  .foot-note { text-align: center; font-size: 11px; color: var(--faint); margin-top: 8px; }
  #modes { display: none; }
  .modechip { display: none; }
  body.full #log { max-width: 760px; margin: 0 auto; width: 100%; }
  body.full footer .inwrap, body.full .foot-note { max-width: 760px; margin-left: auto; margin-right: auto; }
  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: rgb(255 255 255 / .1); border-radius: 8px; }
  /* Sidomenyn (som ChatGPT-appen): nytt samtal, sök, minnen och alla samtal.
     Bred panel/helskärm: alltid synlig. Smal panel: glider in från vänster. */
  body { flex-direction: row; }
  #main { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }
  #side { flex: 0 0 260px; width: 260px; height: 100%; display: flex; flex-direction: column; background: #0a0a0b; border-right: 1px solid var(--line); z-index: 20; }
  .s-top { display: flex; align-items: center; gap: 9px; height: 52px; padding: 0 8px 0 14px; font-weight: 650; font-size: 14px; }
  .s-top img { width: 22px; height: 22px; object-fit: contain; }
  .s-top .grow { flex: 1; }
  .s-nav { display: flex; flex-direction: column; gap: 1px; padding: 4px 8px 6px; }
  .s-item { display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--ink);
    font: inherit; font-size: 13.5px; font-weight: 500; text-align: left; cursor: pointer; transition: background .15s; }
  .s-item:hover { background: rgb(255 255 255 / .05); }
  .s-item svg { width: 17px; height: 17px; flex: none; color: var(--mut); }
  .s-item .n { margin-left: auto; font-size: 11.5px; color: var(--faint); }
  .s-search { cursor: text; }
  .s-search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--ink); font: inherit; font-size: 13.5px; }
  .s-search input::placeholder { color: var(--ink); opacity: 1; }
  .s-search:focus-within { background: var(--surface); }
  .s-search:focus-within input::placeholder { color: var(--faint); }
  .s-search input::-webkit-search-cancel-button { display: none; }
  #s-list { flex: 1; overflow-y: auto; padding: 4px 8px 16px; }
  .s-lbl { padding: 14px 10px 6px; font-size: 12px; font-weight: 600; color: var(--faint); }
  .s-conv { position: relative; display: flex; align-items: center; width: 100%; height: 34px; padding: 0 34px 0 10px; border: 0; border-radius: 8px; background: transparent;
    color: #d4d4d9; font: inherit; font-size: 13.5px; text-align: left; cursor: pointer; transition: background .15s, color .15s; }
  .s-conv span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .s-conv:hover { background: rgb(255 255 255 / .05); color: var(--ink); }
  .s-conv.on { background: var(--surface-2); color: var(--ink); }
  .s-conv .x { position: absolute; right: 4px; top: 4px; width: 26px; height: 26px; border-radius: 6px; display: none; place-items: center; color: var(--faint); }
  .s-conv:hover .x, .s-conv.on .x { display: grid; }
  .s-conv .x:hover { color: #ff8a7a; background: rgb(255 255 255 / .06); }
  .s-conv .x svg { width: 14px; height: 14px; }
  .s-none { padding: 12px 10px; font-size: 12.5px; color: var(--faint); line-height: 1.5; }
  #sidebtn { display: none; }
  #scrim { display: none; }
  @media (max-width: 719px) {
    /* Menyn glider in ovanpå chatten, skuggan och mörkläggningen tonar med */
    body:not(.full) #side { position: absolute; left: 0; top: 0; bottom: 0; transform: translate3d(-100%,0,0); box-shadow: none;
      transition: transform .42s cubic-bezier(.32,.72,0,1), box-shadow .42s ease; will-change: transform; }
    body:not(.full).side-open #side { transform: translate3d(0,0,0); box-shadow: 16px 0 40px rgb(0 0 0 / .45); }
    body:not(.full) #sidebtn { display: grid; }
    body:not(.full) #scrim { display: block; position: absolute; inset: 0; z-index: 15; background: rgb(0 0 0 / .45);
      opacity: 0; visibility: hidden; transition: opacity .42s ease, visibility 0s linear .42s; }
    body:not(.full).side-open #scrim { opacity: 1; visibility: visible; transition: opacity .42s ease; }
    body:not(.full) header .dot { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { #side, #scrim { transition: none !important; } }
  @media (min-width: 720px) { #sideclose { display: none; } }
  body.full #sideclose { display: none; }
  /* Samtal, minnen och nytt samtal finns i sidomenyn, så de dubbla knapparna uppe till höger göms */
  #membtn, #newchat { display: none; }
  #convbtn { display: none; }

  /* Hälsningen när samtalet är tomt: mitt i ytan, med ditt namn */
  .hero { margin: auto 0; align-items: center; text-align: center; padding: 24px 4px; }
  .hero .big { width: 36px; height: 36px; margin-bottom: 14px; }
  .hero .big img { width: 36px; height: 36px; }
  .hero h1 { font-size: 26px; letter-spacing: -.03em; line-height: 1.2; }
  .hero h1 em { display: block; font-style: normal; color: var(--mut); font-weight: 600; }
  .hero p { margin: 6px auto 0; }
  .sugg { max-width: 460px; margin: 22px auto 0; }

  /* ── claude.ai-känsla: Falks svar i serif utan avatar, mjuk "skriver"-fram-effekt,
     ugglan pulserar under svaret medan det skrivs, och diskreta knapprader under meddelandena. */
  .msg.krypto .av { display: none; }
  .msg.krypto { flex-direction: column; gap: 0; }
  .msg.krypto .bubble { font-family: "Tiempos Text", "Source Serif 4", Charter, "Bitstream Charter", "Iowan Old Style", Georgia, "Noto Serif", serif;
    font-size: 15.5px; line-height: 1.68; color: #ebe9e4; letter-spacing: .002em; padding-top: 0; }
  .msg.user { flex-direction: column; align-items: flex-end; gap: 0; }
  .msg.user .bubble { border-radius: 16px; padding: 9px 14px; background: #26262a; font-size: 14.5px; }
  .msg.typing .bubble { font-family: inherit; }
  .w { opacity: 0; animation: wordin .32s ease-out forwards; }
  @keyframes wordin { from { opacity: 0; filter: blur(2px); } to { opacity: 1; filter: none; } }
  .writing-owl { display: block; }
  .acts { display: flex; align-items: center; gap: 2px; margin-top: 8px; opacity: 0; transition: opacity .15s; }
  .msg:hover .acts, .msg.last .acts, .acts:focus-within { opacity: 1; }
  .msg.user .acts { margin-top: 6px; }
  .acts .ts { font-size: 11.5px; color: var(--faint); margin-right: 6px; font-family: Inter, system-ui, sans-serif; }
  .ab { position: relative; width: 28px; height: 28px; border: 0; border-radius: 7px; background: transparent; color: var(--mut); display: grid; place-items: center; cursor: pointer; transition: background .15s, color .15s; }
  .ab:hover { background: rgb(255 255 255 / .07); color: var(--ink); }
  .ab.on { color: var(--ink); }
  .ab.fbb.on svg { fill: currentColor; }
  .ab.fbb.pop svg { animation: fbpop .35s ease-out; }
  @keyframes fbpop { 40% { transform: scale(1.3); } }
  .ab svg { width: 16px; height: 16px; }
  .ab[data-tip]:hover::after { content: attr(data-tip); position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); white-space: nowrap; z-index: 30;
    font: 500 12px/1 Inter, system-ui, sans-serif; color: #f2f2f4; background: #2e2e33; padding: 6px 8px; border-radius: 6px; box-shadow: 0 6px 18px rgb(0 0 0 / .4); pointer-events: none; }
  .msg.writing .acts { display: none; }
  .acts .ab:first-child[data-tip]:hover::after { left: 0; transform: none; }
  .msg.user .acts .ab:last-child[data-tip]:hover::after { left: auto; right: 0; transform: none; }
  @media (prefers-reduced-motion: reduce) { .w { animation: none; opacity: 1; } .writing-owl { animation: none; } }

  /* ── Formaterade svar: stycken, rubriker, listor, kod, tabeller, diagram ── */
  .msg.krypto .bubble { white-space: normal; }
  .bubble p { margin: 0 0 .75em; } .bubble p:last-child { margin-bottom: 0; }
  .bubble .mh { font-weight: 650; letter-spacing: -.01em; margin: 1em 0 .4em; line-height: 1.3; } .bubble .mh:first-child { margin-top: 0; }
  .bubble .mh1 { font-size: 19px; } .bubble .mh2 { font-size: 17px; } .bubble .mh3 { font-size: 15.5px; }
  .bubble ul, .bubble ol { margin: 0 0 .75em; padding-left: 1.35em; } .bubble li { margin: .2em 0; } .bubble li::marker { color: var(--mut); }
  .bubble code.ic { font: 12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: #1d1d20; border: 1px solid var(--line); padding: 1px 5px; border-radius: 5px; color: #f0c8b8; }
  .cb { margin: .85em 0; border: 1px solid var(--line); border-radius: 12px; background: #121214; overflow: hidden; }
  .cb-h { display: flex; align-items: center; justify-content: space-between; height: 34px; padding: 0 5px 0 14px; border-bottom: 1px solid var(--line); font: 500 12px/1 Inter, system-ui, sans-serif; color: var(--mut); }
  .cb-h .ab { width: 26px; height: 26px; } .cb-h .ab svg { width: 15px; height: 15px; }
  .cb-h .ab[data-tip]:hover::after { left: auto; right: 0; transform: none; }
  .cb pre { margin: 0; padding: 12px 14px; overflow-x: auto; font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color: #e6e6ea; white-space: pre; tab-size: 2; }
  .cb.doc .cb-b { padding: 14px 16px; font-size: 15px; line-height: 1.65; max-height: 420px; overflow-y: auto; }
  .tbl { margin: .85em 0; border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; background: #121214; }
  .tbl table { width: 100%; border-collapse: collapse; font: 13px/1.45 Inter, system-ui, sans-serif; color: #e6e6ea; }
  .tbl th { text-align: left; font-weight: 600; font-size: 12px; color: var(--mut); background: #161618; padding: 9px 12px; white-space: nowrap; }

<script>
/* Fokusringen (orange ram) visas bara när du använder tangentbordet (Tab/piltangenter).
   Efter musklick, eller när en ruta stängs och fokus hoppar tillbaka till en knapp, syns ingen ram. */
(function () {
  const root = document.documentElement;
  const st = document.createElement('style');
  st.textContent = 'html:not([data-kbd]) :focus, html:not([data-kbd]) :focus-visible { outline: none !important; }'
    + ' html:not([data-kbd]) button:focus, html:not([data-kbd]) a:focus, html:not([data-kbd]) [role="button"]:focus, html:not([data-kbd]) .switch input:focus + .track { box-shadow: none; }';
  (document.head || root).appendChild(st);
  const NAV = new Set(['Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Home', 'End', 'PageUp', 'PageDown']);
  addEventListener('keydown', (e) => { if (NAV.has(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey) root.setAttribute('data-kbd', ''); }, true);
  addEventListener('pointerdown', () => root.removeAttribute('data-kbd'), true);
})();
</script>

      <button id="send" title="Skicka">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
    <div class="foot-note">Falk kan ha fel. Dela aldrig lösenord eller BankID.</div>
  </footer>
  </div>

  <script src="i18n.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const log = $('log'), inp = $('inp'), sendBtn = $('send');
    const MEM = 'krypto-memories', CONV = 'krypto-convos', HIST = 'krypto-chat-history';
    let busy = false;

    /* ── Samtal ── */
    let convos = [], activeId = null, history = [];
    function loadConvos() {
      try { const o = JSON.parse(localStorage.getItem(CONV)); if (o && Array.isArray(o.list)) { convos = o.list; activeId = o.activeId; } } catch {}
      if (!convos.length) {
        let old = []; try { const h = JSON.parse(localStorage.getItem(HIST)); if (Array.isArray(h)) old = h; } catch {}
        const c = { id: cid(), title: titleFrom(old), ts: Date.now(), messages: old, mode: 'fraga' };
        convos = [c]; activeId = c.id; saveConvos();
      }
      if (!activeConvo()) activeId = convos[convos.length - 1].id;
      history = activeConvo().messages;
    }
    function cid() { return 'c' + Date.now() + Math.floor(Math.random() * 1000); }
    function titleFrom(msgs) { const u = (msgs || []).find((m) => m.role === 'user'); return u ? u.content.slice(0, 44) : 'Nytt samtal'; }
    function saveConvos() { try { localStorage.setItem(CONV, JSON.stringify({ list: convos.slice(-50), activeId })); } catch {} if (typeof renderSide === 'function') renderSide(); }
    function activeConvo() { return convos.find((c) => c.id === activeId); }
    function newConvo(projectId) {
      const c = { id: cid(), title: 'Nytt samtal', ts: Date.now(), messages: [], mode: (typeof kMode !== 'undefined' ? kMode : 'fraga') };
      if (typeof projectId === 'string') c.projectId = projectId;
      convos.push(c); activeId = c.id; history = c.messages; saveConvos();
      updateConvTitle(); render(); closePanels(); inp.focus();
    }
    function openConvo(id) {
      const c = convos.find((x) => x.id === id); if (!c) return;
      activeId = id; history = c.messages; saveConvos();
      if (typeof applyModeUI === 'function') applyModeUI(c.mode || 'fraga');
      updateConvTitle(); render(); closePanels();
    }
    function deleteConvo(id) {
      { const d = convos.find((c) => c.id === id); if (d) for (const m of d.messages) for (const f of m.files || []) idb.del(f.id).catch(() => {}); }
      convos = convos.filter((c) => c.id !== id);
      if (!convos.length) { newConvo(); return; }
      if (activeId === id) { activeId = convos[convos.length - 1].id; history = activeConvo().messages; updateConvTitle(); render(); }
      saveConvos(); renderConvList();
    }
    function touchConvo(text) {
      const c = activeConvo(); if (!c) return;
      if (!c.title || c.title === 'Nytt samtal') c.title = (text || '').slice(0, 44) || 'Nytt samtal';
      c.ts = Date.now();
    }
    function updateConvTitle() { if (typeof updateProjChip === 'function') updateProjChip(); const c = activeConvo(); $('convtitle').textContent = (c && c.messages.length) ? (c.title || 'Samtal') : 'Din säkerhetsassistent'; }

    /* ── Minne ── */
    function memGet() { try { const m = JSON.parse(localStorage.getItem(MEM)); return Array.isArray(m) ? m : []; } catch { return []; } }
    function memSet(list) { try { localStorage.setItem(MEM, JSON.stringify(list.slice(-80))); } catch {} updateBadge(); }
    function memAdd(text) {
      text = (text || '').trim(); if (!text) return null;
      const list = memGet();
      if (list.some((m) => m.text.toLowerCase() === text.toLowerCase())) return null;
      const rec = { id: 'm' + Date.now() + Math.floor(Math.random() * 1000), text, ts: Date.now() };
      list.push(rec); memSet(list); return rec;
    }
    function memDelByText(needle) {
      needle = (needle || '').trim().toLowerCase(); if (!needle) return null;
      const list = memGet();
      let idx = list.findIndex((m) => m.text.toLowerCase() === needle);
      if (idx < 0) idx = list.findIndex((m) => m.text.toLowerCase().includes(needle) || needle.includes(m.text.toLowerCase()));
      if (idx < 0) return null;
      const [rec] = list.splice(idx, 1); memSet(list); return rec;
    }
    function memDelById(id) { memSet(memGet().filter((m) => m.id !== id)); }
    function memEdit(id, text) { const list = memGet(); const m = list.find((x) => x.id === id); if (m) { m.text = (text || '').trim(); memSet(list.filter((x) => x.text)); } }
    function updateBadge() { const n = memGet().length; const b = $('membadge'); b.textContent = n; b.classList.toggle('on', n > 0); if ($('mempanel').classList.contains('on')) renderMemList(); }

    /* ── Rendering av chatten ── */
    function esc(s) { return (s || '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
    // Följ med nedåt bara så länge du inte själv scrollat upp (då får du läsa i fred medan Falk skriver)
    let follow = true;
    const nearBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 60;
    log.addEventListener('wheel', (e) => { if (e.deltaY < 0) follow = false; }, { passive: true });
    log.addEventListener('touchmove', () => { follow = false; }, { passive: true });
    log.addEventListener('keydown', (e) => { if (['PageUp', 'ArrowUp', 'Home'].includes(e.key)) follow = false; });
    log.addEventListener('mousedown', (e) => { if (e.offsetX > log.clientWidth) follow = false; });   // dra i scrollbaren
    let lastTop = 0;
    log.addEventListener('scroll', () => { if (log.scrollTop > lastTop && nearBottom()) follow = true; lastTop = log.scrollTop; }, { passive: true });   // scrollat ned till botten igen → följ med
    function scrollBottom(force) { if (force) follow = true; const go = () => { if (follow) log.scrollTop = log.scrollHeight + 9999; }; go(); requestAnimationFrame(() => requestAnimationFrame(go)); setTimeout(go, 120); setTimeout(go, 560); }
    const AV_KRYPTO = '<img class="owl" src="krypto-owl-face.png" alt="">';
    const AV_USER = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
    const BRAIN = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 0 0-5.9-.6A3 3 0 0 0 4 9.5a3 3 0 0 0 0 5A3 3 0 0 0 8 19a3 3 0 0 0 4 1 3 3 0 0 0 4-1 3 3 0 0 0 4-4.5 3 3 0 0 0 0-5A3 3 0 0 0 17.9 4.4 3 3 0 0 0 12 5Z"/></svg>';
    function fmt(t) { return esc(t).replace(/\n/g, '<br>'); }

    // Falks svar som enkel markdown. Allt escapas först – bara våra egna taggar byggs (inga länkar, ingen rå HTML).
    const escA = (t) => esc(t).replace(/"/g, '&quot;');
    function inl(t) {
      return t.split(/(`[^`]+`)/).map((part) => {
        if (/^`[^`]+`$/.test(part)) return '<code class="ic">' + esc(part.slice(1, -1)) + '</code>';
        return esc(part).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)"<>]+)\)/g, '<a class="ml" href="$2" target="_blank" rel="noopener">$1</a>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?![*\w])/g, '$1<i>$2</i>');
      }).join('');
    }
    const CHART_LANGS = ['diagram', 'chart', 'graf'];
    const DOC_LANGS = ['text', 'txt', 'mejl', 'email', 'brev', 'dokument', 'rapport', 'markdown', 'md', 'meddelande'];
    function block(lang, code) {
      if (CHART_LANGS.includes(lang)) { try { const j = JSON.parse(code); if (normSpec(j)) return '<div class="chart" data-spec="' + escA(JSON.stringify(j)) + '"></div>'; } catch {} }
      const cp = '<button type="button" class="ab cpy" data-tip="' + escA(tx('Kopiera')) + '" aria-label="' + escA(tx('Kopiera')) + '">' + I_COPY + '</button>';
      if (DOC_LANGS.includes(lang)) {
        const body = (lang === 'markdown' || lang === 'md' || lang === 'rapport') ? md(code) : '<p>' + esc(code).replace(/\n{2,}/g, '</p><p>').replace(/\n/g, '<br>') + '</p>';
        return '<div class="cb doc" data-raw="' + escA(code) + '"><div class="cb-h"><span>' + esc(tx('Text')) + '</span>' + cp + '</div><div class="cb-b">' + body + '</div></div>';
      }
      return '<div class="cb" data-raw="' + escA(code) + '"><div class="cb-h"><span>' + esc(lang || tx('Kod')) + '</span>' + cp + '</div><pre><code>' + esc(code) + '</code></pre></div>';
    }
    function table(rows) {
      const cells = (r) => r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
      const head = cells(rows[0]), body = rows.slice(2).map(cells);
      const num = head.map((_, k) => body.length > 0 && body.every((r) => !r[k] || /^[-+−]?[\d\s.,]+\s*(%|kr|st|h|min|s|ms|MB|GB|kB|€|\$|SEK)?$/i.test(r[k])));
      return '<div class="tbl"><table><thead><tr style="--r:0">' + head.map((h, k) => '<th' + (num[k] ? ' class="num"' : '') + '>' + inl(h) + '</th>').join('') + '</tr></thead><tbody>'
        + body.map((r, i) => '<tr style="--r:' + (i + 1) + '">' + head.map((_, k) => '<td' + (num[k] ? ' class="num"' : '') + '>' + inl(r[k] || '') + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
    }
    function md(src) {
      const L = String(src || '').replace(/\r/g, '').split('\n'); let out = '', para = [], i = 0;
      const flush = () => { if (para.length) { out += '<p>' + para.map(inl).join('<br>') + '</p>'; para = []; } };
      while (i < L.length) {
        const line = L[i];
        const f = line.match(/^\s*```\s*([\w+#.-]*)\s*$/);
        if (f) { flush(); const buf = []; i++; while (i < L.length && !/^\s*```\s*$/.test(L[i])) buf.push(L[i++]); i++; out += block(f[1].toLowerCase(), buf.join('\n')); continue; }
        if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < L.length && /^\s*\|?\s*:?-{2,}/.test(L[i + 1])) { flush(); const rows = []; while (i < L.length && /^\s*\|.*\|\s*$/.test(L[i])) rows.push(L[i++]); out += table(rows); continue; }
        const h = line.match(/^(#{1,4})\s+(.+)$/);
        if (h) { flush(); out += '<div class="mh mh' + Math.min(3, h[1].length) + '">' + inl(h[2]) + '</div>'; i++; continue; }
        const li = line.match(/^\s*([-*•]|\d+[.)])\s+(.+)$/);
        if (li) { flush(); const ol = /\d/.test(li[1]); const items = []; while (i < L.length) { const m = L[i].match(/^\s*([-*•]|\d+[.)])\s+(.+)$/); if (!m || /\d/.test(m[1]) !== ol) break; items.push(m[2]); i++; } out += (ol ? '<ol>' : '<ul>') + items.map((x) => '<li>' + inl(x) + '</li>').join('') + (ol ? '</ol>' : '</ul>'); continue; }
        if (!line.trim()) { flush(); i++; continue; }
        para.push(line); i++;
      }
      flush(); return out || '<p></p>';
    }
    // Kopiera-knappen på kod- och textblock
    log.addEventListener('click', (e) => {
      const b = e.target.closest('.cpy'); if (!b) return;
      const box = b.closest('.cb'); try { navigator.clipboard.writeText(box.dataset.raw || ''); } catch {}
      b.innerHTML = I_OK; b.dataset.tip = tx('Kopierat'); setTimeout(() => { b.innerHTML = I_COPY; b.dataset.tip = tx('Kopiera'); }, 1500);
    });

    /* ── Diagram (Falk skriver ```diagram med JSON) ──
       linje = utveckling över tid · stapel = jämför kategorier · stolpe = många värden/fördelning · liggande = långa etiketter/rangordning.
       Färger: en serie = AdRaze-orange; flera = validerad färgordning för mörk yta (skiljbar även vid färgblindhet). */
    const C_ONE = '#ff6a3d', C_MANY = ['#3987e5', '#d95926', '#199e70', '#c98500'];
    const TYPES = { linje: 'line', line: 'line', linjediagram: 'line', stapel: 'col', stapeldiagram: 'col', column: 'col', kolumn: 'col', bar: 'col',
      stolpe: 'stick', stolp: 'stick', stolpdiagram: 'stick', lollipop: 'stick', liggande: 'hbar', 'liggande stapel': 'hbar', horisontell: 'hbar', hbar: 'hbar' };
    function normSpec(r) {
      if (!r || typeof r !== 'object') return null;
      const type = TYPES[String(r.typ || r.type || '').toLowerCase().trim()] || 'col';
      let ser = r.serier || r.series;
      if (!Array.isArray(ser)) ser = Array.isArray(r.data) ? [{ namn: r.titel || r.title || '', data: r.data }] : [];
      const toNum = (v) => typeof v === 'number' ? v : parseFloat(String(v).replace(/\s/g, '').replace(',', '.').replace('−', '-'));
      ser = ser.slice(0, 4).map((x) => ({ name: String((x && (x.namn || x.name)) || ''), data: ((x && (x.data || x.values)) || []).slice(0, 40).map(toNum) }));
      const n = Math.max(0, ...ser.map((x) => x.data.length));
      if (!n || !ser.some((x) => x.data.some(Number.isFinite))) return null;
      const lab = (r.etiketter || r.labels || []).slice(0, 40).map(String);
      return { type, title: String(r.titel || r.title || ''), unit: String(r.enhet || r.unit || ''), labels: Array.from({ length: n }, (_, i) => lab[i] || String(i + 1)), series: ser, n };
    }
    const NFx = {};
    function nf(v, compact) { if (!Number.isFinite(v)) return '–'; const k = compact ? 'c' : 'n'; NFx[k] = NFx[k] || new Intl.NumberFormat(document.documentElement.lang || 'sv', compact ? { notation: 'compact', maximumFractionDigits: 1 } : { maximumFractionDigits: 2 }); return NFx[k].format(v); }
    function niceTicks(lo, hi) {
      const raw = (hi - lo) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
      const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
      const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, list = [];
      for (let v = a; v <= b + step / 2; v += step) list.push(Math.round(v / step) * step);
      return { lo: a, hi: b, list };
    }
    function barPath(x, yb, yv, w) {
      const r = Math.min(4, w / 2, Math.abs(yb - yv)), up = yv <= yb, s = up ? 1 : -1;
      return 'M' + x + ',' + yb + 'V' + (yv + s * r) + 'Q' + x + ',' + yv + ' ' + (x + r) + ',' + yv + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + yv + ' ' + (x + w) + ',' + (yv + s * r) + 'V' + yb + 'Z';
    }
    function drawChart(c, raw, anim) {
      const S = normSpec(raw); if (!S) return;
      const cols = S.series.length === 1 ? [C_ONE] : C_MANY;
      const unit = S.unit && S.unit.length <= 5 ? (S.unit === '%' ? ' %' : ' ' + S.unit) : '';
      const fu = (v) => nf(v) + (Number.isFinite(v) ? unit : '');
      let html = (S.title ? '<div class="ch-t">' + esc(S.title) + '</div>' : '') + (S.unit && !unit ? '<div class="ch-s">' + esc(S.unit) + '</div>' : (S.unit ? '<div class="ch-s">' + esc(tx('Enhet')) + ': ' + esc(S.unit) + '</div>' : ''));
      if (S.series.length > 1) html += '<div class="ch-lg">' + S.series.map((x, k) => '<span><i class="' + (S.type === 'line' ? 'ln' : '') + '" style="background:' + cols[k] + '"></i>' + esc(x.name || tx('Serie') + ' ' + (k + 1)) + '</span>').join('') + '</div>';
      if (S.type === 'hbar') {
        const mx = Math.max(...S.series.flatMap((x) => x.data.filter(Number.isFinite).map(Math.abs)), 1e-9);
        html += '<div class="hb">' + S.labels.map((l, i) => '<div class="hb-r" style="--i:' + i + '"><div class="hb-l" data-i="' + i + '" title="' + escA(l) + '">' + esc(l) + '</div><div class="hb-t" data-i="' + i + '" style="--i:' + i + '">'
          + S.series.map((x, k) => '<i data-i="' + i + '" style="--i:' + i + ';width:' + (Number.isFinite(x.data[i]) ? Math.max(0, x.data[i]) / mx * 100 : 0).toFixed(2) + '%;background:' + cols[k] + (S.series.length > 1 ? ';height:8px' : '') + '"></i>').join('')
          + '</div><div class="hb-v" style="--i:' + i + '">' + (S.series.length === 1 ? fu(S.series[0].data[i]) : '') + '</div></div>').join('') + '</div>';
      } else {
        const W = Math.max(240, (c.clientWidth || 380) - 28), H = 200, pt = 14, pb = 24;
        const all = S.series.flatMap((x) => x.data).filter(Number.isFinite);
        let lo = Math.min(0, ...all), hi = Math.max(0, ...all); if (hi === lo) hi = lo + 1;
        const T = niceTicks(lo, hi), compact = Math.max(Math.abs(T.lo), Math.abs(T.hi)) >= 10000;
        const tl = T.list.map((v) => nf(v, compact));
        const pl = Math.max(...tl.map((t) => t.length)) * 6.4 + 12;
        const endLab = S.type === 'line' && S.series.length <= 2;
        const pr = endLab ? Math.min(64, Math.max(...S.series.map((x) => fu(x.data[x.data.length - 1]).length)) * 6.4 + 12) : 6;
        const pw = W - pl - pr, ph = H - pt - pb;
        const y = (v) => pt + (T.hi - v) / (T.hi - T.lo) * ph, y0 = y(0);
        const band = pw / S.n;
        const cx = (i) => S.type === 'line' ? pl + (S.n === 1 ? pw / 2 : i * pw / (S.n - 1)) : pl + band * (i + 0.5);
        let g = '';
        T.list.forEach((v, k) => { g += '<line class="' + (v === 0 ? 'base' : 'gr') + '" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (pl - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + esc(tl[k]) + '</text>'; });
        const every = Math.ceil(S.n / Math.max(1, Math.floor(pw / 52)));
        S.labels.forEach((l, i) => { if (i % every) return; const t = l.length > 10 ? l.slice(0, 9) + '…' : l; g += '<text x="' + cx(i) + '" y="' + (H - 6) + '" text-anchor="' + (S.type === 'line' && i === 0 && S.n > 1 ? 'start' : S.type === 'line' && i === S.n - 1 && S.n > 1 ? 'end' : 'middle') + '">' + esc(t) + '</text>'; });
        const k = S.series.length;
        if (S.type === 'col' || S.type === 'stick') {
          const gw = band * (S.type === 'stick' ? 0.5 : 0.72), bw = S.type === 'stick' ? 0 : Math.max(2, Math.min(24, (gw - (k - 1) * 2) / k));
          const step = S.type === 'stick' ? (k > 1 ? Math.min(12, gw / k) : 0) : bw + 2;
          const tw = S.type === 'stick' ? step * (k - 1) : k * bw + (k - 1) * 2;
          S.series.forEach((x, s) => x.data.forEach((v, i) => {
            if (!Number.isFinite(v)) return;
            const x0 = cx(i) - tw / 2 + s * step, yv = y(v), org = v >= 0 ? 'bottom' : 'top';
            if (S.type === 'col') g += '<path class="bar" d="' + barPath(x0, y0, yv, bw) + '" fill="' + cols[s] + '" style="--i:' + i + ';transform-origin:center ' + org + '"/>';
            else g += '<line class="stem" x1="' + x0 + '" x2="' + x0 + '" y1="' + y0 + '" y2="' + yv + '" stroke="' + cols[s] + '" style="--i:' + i + ';transform-origin:center ' + org + '"/><circle class="dot" cx="' + x0 + '" cy="' + yv + '" r="5" fill="' + cols[s] + '" style="--i:' + i + '"/>';
            if (k === 1 && band >= 30) g += '<text class="vl" x="' + cx(i) + '" y="' + (v >= 0 ? yv - (S.type === 'stick' ? 10 : 6) : yv + 15) + '" text-anchor="middle" style="--i:' + i + '">' + esc(nf(v, compact)) + '</text>';
          }));
        } else {
          const ends = [];
          S.series.forEach((x, s) => {
            let d = '', pen = false, first = -1, last = -1;
            x.data.forEach((v, i) => { if (!Number.isFinite(v)) { pen = false; return; } d += (pen ? 'L' : 'M') + cx(i).toFixed(1) + ',' + y(v).toFixed(1); pen = true; if (first < 0) first = i; last = i; });
            if (k === 1 && first >= 0 && x.data.slice(first, last + 1).every(Number.isFinite)) g += '<path class="area" d="' + d + 'L' + cx(last) + ',' + y0 + 'L' + cx(first) + ',' + y0 + 'Z" fill="' + cols[s] + '" fill-opacity=".12"/>';
            g += '<path class="ln" pathLength="1" d="' + d + '" stroke="' + cols[s] + '"/>';
            if (last >= 0) { g += '<circle class="dot" cx="' + cx(last) + '" cy="' + y(x.data[last]) + '" r="4.5" fill="' + cols[s] + '" style="--i:' + (S.n + 6) + '"/>'; ends.push({ y: y(x.data[last]), x: cx(last), v: x.data[last], i: S.n + 8 }); }
          });
          if (endLab && (ends.length < 2 || Math.abs(ends[0].y - ends[1].y) > 14)) ends.forEach((e) => { g += '<text class="vl" x="' + (e.x + 9) + '" y="' + (e.y + 4) + '" style="--i:' + e.i + '">' + esc(fu(e.v)) + '</text>'; });
          g += '<line class="xh" x1="0" x2="0" y1="' + pt + '" y2="' + (H - pb) + '"/>';
        }
        S.labels.forEach((_, i) => { const w = S.type === 'line' ? (S.n === 1 ? pw : pw / (S.n - 1)) : band; g += '<rect class="hit" data-i="' + i + '" data-cx="' + cx(i) + '" x="' + (cx(i) - w / 2) + '" y="' + pt + '" width="' + w + '" height="' + ph + '"/>'; });

      sendBtn.disabled = busy;
    }
    function note(t) { $('attnote').textContent = t || ''; if (t) { clearTimeout(note._t); note._t = setTimeout(() => { $('attnote').textContent = ''; }, 9000); } }
    async function attach(entries, folder) {
      if (!entries.length) return;
      $('chips').insertAdjacentHTML('beforeend', '<div class="fchip loading"><span class="fi">' + (folder ? DIR_IC : FILE_IC) + '</span><span class="fn"><b>' + esc(tx('Läser…')) + '</b></span></div>');
      const { items, note: n } = await readUpload(entries, Math.max(0, MSG_CAP - pendingChars()), folder);
      pending.push(...items); renderPending(); note(n || (items.length ? '' : tx('Inga textfiler att läsa.'))); inp.focus();
    }
    function toggleAttMenu(open) {
      const m = $('attmenu'); const on = open === undefined ? !m.classList.contains('on') : open;
      m.classList.toggle('on', on);
      const p = projOf(activeConvo()); $('am-projname').textContent = p ? p.name : '';
    }
    $('attach').addEventListener('click', (e) => { e.stopPropagation(); toggleAttMenu(); });
    document.addEventListener('click', (e) => { if (!e.target.closest('#attmenu')) toggleAttMenu(false); });
    $('am-files').addEventListener('click', () => { toggleAttMenu(false); $('f-files').click(); });
    $('am-dir').addEventListener('click', () => { toggleAttMenu(false); $('f-dir').click(); });
    $('am-proj').addEventListener('click', () => { toggleAttMenu(false); const p = projOf(activeConvo()); openProjects(p ? p.id : null); });
    $('f-files').addEventListener('change', async (e) => { await attach(fromInput(e.target), false); e.target.value = ''; });
    $('f-dir').addEventListener('change', async (e) => { await attach(fromInput(e.target), true); e.target.value = ''; });
    let dragN = 0;
    document.body.dataset.drop = tx('Släpp filer eller mappar här');
    window.addEventListener('dragenter', (e) => { if ([...(e.dataTransfer.types || [])].includes('Files')) { dragN++; document.body.classList.add('drag'); } });
    window.addEventListener('dragleave', () => { if (--dragN <= 0) { dragN = 0; document.body.classList.remove('drag'); } });
    window.addEventListener('dragover', (e) => { e.preventDefault(); });
    window.addEventListener('drop', async (e) => {
      e.preventDefault(); dragN = 0; document.body.classList.remove('drag');
      const { entries, folder } = await fromDrop(e.dataTransfer);
      if ($('projpanel').classList.contains('on') && projView) await addProjFiles(projView, entries, folder);
      else await attach(entries, folder);
    });

    // Det som skickas till servern: text + bifogade filer (läses från IndexedDB)
    async function withFiles(m) {
      if (!m.files || !m.files.length) return { role: m.role, content: m.content };
      const parts = await Promise.all(m.files.map(async (f) => {
        const o = await idb.get(f.id).catch(() => null);
        const body = o ? o.text : '(filen finns inte längre)';
        return f.kind === 'mapp' ? '<mapp namn="' + f.name + '">\n' + body + '\n</mapp>' : '<fil namn="' + f.name + '">\n' + body + '\n</fil>';
      }));
      return { role: m.role, content: (m.content || tx('Titta på det jag bifogade.')) + '\n\n' + tx('Bifogat') + ':\n' + parts.join('\n\n') };
    }

    /* Projekt: namn, instruktioner och filer som Falk alltid har med i projektets samtal */
    const PROJ = 'krypto-projects';
    var projects = []; try { const o = JSON.parse(localStorage.getItem(PROJ)); if (Array.isArray(o)) projects = o; } catch {}
    var projView = null;
    function saveProjects() { try { localStorage.setItem(PROJ, JSON.stringify(projects)); } catch {} $('s-projn').textContent = projects.length || ''; updateProjChip(); }
    function projOf(c) { return c && c.projectId ? projects.find((p) => p.id === c.projectId) : null; }
    function updateProjChip() { const p = projOf(activeConvo()); const el = $('projchip'); el.textContent = p ? p.name : ''; el.classList.toggle('on', !!p); }
    $('projchip').addEventListener('click', () => { const p = projOf(activeConvo()); if (p) openProjects(p.id); });
    async function projectText(c) {
      const p = projOf(c); if (!p) return '';
      const files = await Promise.all((p.files || []).map(async (f) => { const o = await idb.get(f.id).catch(() => null); return o ? (f.kind === 'mapp' ? '<mapp namn="' + f.name + '">\n' + o.text + '\n</mapp>' : '<fil namn="' + f.name + '">\n' + o.text + '\n</fil>') : ''; }));
      return '\n\nAKTIVT PROJEKT: "' + p.name + '". Samtalet hör till det här projektet.' + (p.instr ? '\nAnvändarens instruktioner för projektet (följ dem):\n' + p.instr : '')
        + (files.filter(Boolean).length ? '\nProjektets filer (kunskap du ska använda och hänvisa till med filnamn):\n' + files.filter(Boolean).join('\n\n') : '');
    }
    function projChars(p) { return (p.files || []).reduce((a, f) => a + (f.chars || 0), 0); }
    async function addProjFiles(id, entries, folder) {
      const p = projects.find((x) => x.id === id); if (!p || !entries.length) return;
      const { items, note: n } = await readUpload(entries, Math.max(0, PROJ_CAP - projChars(p)), folder);
      for (const f of items) { await idb.put({ id: f.id, text: f.text }); const { text, ...meta } = f; p.files.push(meta); }
      saveProjects(); renderProject(id, n || (items.length ? '' : tx('Inga textfiler att läsa.')));
    }
    $('pf-files').addEventListener('change', async (e) => { if (projView) await addProjFiles(projView, fromInput(e.target), false); e.target.value = ''; });
    $('pf-dir').addEventListener('change', async (e) => { if (projView) await addProjFiles(projView, fromInput(e.target), true); e.target.value = ''; });
    const CLOSE_IC = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
    const BACK_IC = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
    function openProjects(id) { closePanels(); $('projpanel').classList.add('on'); if (id) renderProject(id); else renderProjList(); }
    function renderProjList() {
      projView = null; const el = $('projpanel');
      el.innerHTML = '<div class="p-head"><div style="flex:1"><div class="t">' + esc(tx('Projekt')) + '</div><div class="sub">' + esc(tx('Samla filer och instruktioner som Falk alltid använder i projektets samtal.')) + '</div></div><button class="hbtn" data-a="close" title="' + escA(tx('Stäng')) + '">' + CLOSE_IC + '</button></div>'
        + '<button class="p-newbtn" data-a="new">' + CLIP_PLUS + esc(tx('Nytt projekt')) + '</button><div class="p-list"></div>';
      const list = el.querySelector('.p-list');
      if (!projects.length) list.innerHTML = '<div class="p-empty">' + esc(tx('Inga projekt än. Skapa ett, lägg till filer eller en hel mapp och skriv hur Falk ska jobba.')) + '</div>';
      for (const p of projects.slice().sort((a, b) => b.ts - a.ts)) {
        const n = convos.filter((c) => c.projectId === p.id && c.messages.length).length;
        const r = document.createElement('div'); r.className = 'convrow';
        r.innerHTML = '<div class="cmeta"><div class="ctitle">' + esc(p.name) + '</div><div class="csub">' + esc(plural((p.files || []).length, 'fil', 'filer') + ' · ' + plural(n, 'samtal', 'samtal')) + '</div></div>';
        r.addEventListener('click', () => renderProject(p.id)); list.appendChild(r);
      }
      el.querySelector('[data-a=close]').addEventListener('click', closePanels);
      el.querySelector('[data-a=new]').addEventListener('click', () => { const p = { id: 'p' + Date.now().toString(36), name: tx('Nytt projekt'), instr: '', files: [], ts: Date.now() }; projects.push(p); saveProjects(); renderProject(p.id, '', true); });
    }
    function renderProject(id, msg, focusName) {
      const p = projects.find((x) => x.id === id); if (!p) return renderProjList();
      projView = id; const el = $('projpanel'); const used = projChars(p);
      const convs = convos.filter((c) => c.projectId === id && c.messages.length).sort((a, b) => b.ts - a.ts);
      const cur = activeConvo();
      el.innerHTML = '<div class="p-head"><button class="hbtn" data-a="back" title="' + escA(tx('Alla projekt')) + '">' + BACK_IC + '</button><div style="flex:1"><div class="t">' + esc(tx('Projekt')) + '</div></div><button class="hbtn" data-a="close" title="' + escA(tx('Stäng')) + '">' + CLOSE_IC + '</button></div>'
        + '<div class="pj-body">'
        + '<div><input class="pj-name" value="' + escA(p.name) + '" maxlength="60" spellcheck="false"></div>'
        + '<div><div class="pj-lbl">' + esc(tx('Instruktioner')) + '</div><textarea class="pj-instr" maxlength="4000" placeholder="' + escA(tx('Hur ska Falk jobba i det här projektet? T.ex. "Svara kort, granska koden för säkerhetshål".')) + '">' + esc(p.instr || '') + '</textarea></div>'
        + '<div><div class="pj-lbl"><span>' + esc(tx('Filer')) + '</span><span>' + Math.round(used / PROJ_CAP * 100) + ' % ' + esc(tx('använt')) + '</span></div><div class="pj-meter"><i style="width:' + Math.min(100, used / PROJ_CAP * 100) + '%"></i></div>'
        + '<div class="att-note" style="margin:8px 2px 0">' + esc(msg || '') + '</div>'
        + '<div class="pj-files" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px">' + (p.files || []).map((f) => chipHtml(f, true)).join('') + '</div>'
        + '<div class="pj-btns" style="margin-top:10px"><button class="pj-btn" data-a="files">' + FILE_IC + esc(tx('Lägg till filer')) + '</button><button class="pj-btn" data-a="dir">' + DIR_IC + esc(tx('Lägg till mapp')) + '</button></div></div>'
        + '<div class="pj-btns"><button class="pj-btn pri" data-a="chat">' + esc(tx('Nytt samtal i projektet')) + '</button>'
        + (cur && cur.messages.length && cur.projectId !== id ? '<button class="pj-btn" data-a="move">' + esc(tx('Flytta hit det här samtalet')) + '</button>' : '') + '</div>'
        + (convs.length ? '<div><div class="pj-lbl">' + esc(tx('Samtal')) + '</div><div class="pj-convs"></div></div>' : '')
        + '<div><button class="pj-btn danger" data-a="del">' + esc(tx('Ta bort projektet')) + '</button></div></div>';
      const q = (a) => el.querySelector('[data-a=' + a + ']');
      q('back').addEventListener('click', renderProjList); q('close').addEventListener('click', closePanels);
      const nm = el.querySelector('.pj-name'); nm.addEventListener('input', () => { p.name = nm.value.trim() || tx('Nytt projekt'); saveProjects(); });
      if (focusName) { nm.focus(); nm.select(); }
      const ins = el.querySelector('.pj-instr'); ins.addEventListener('input', () => { p.instr = ins.value; clearTimeout(ins._t); ins._t = setTimeout(saveProjects, 300); });
      el.querySelectorAll('.pj-files .fx').forEach((b) => b.addEventListener('click', () => { const fidv = b.closest('.fchip').dataset.id; p.files = p.files.filter((f) => f.id !== fidv); idb.del(fidv).catch(() => {}); saveProjects(); renderProject(id); }));
      q('files').addEventListener('click', () => $('pf-files').click()); q('dir').addEventListener('click', () => $('pf-dir').click());
      q('chat').addEventListener('click', () => { newConvo(id); });
      if (q('move')) q('move').addEventListener('click', () => { cur.projectId = id; saveConvos(); updateProjChip(); closePanels(); });
      q('del').addEventListener('click', () => {
        if (q('del').dataset.sure !== '1') { q('del').dataset.sure = '1'; q('del').textContent = tx('Säker? Klicka igen'); return; }
        for (const f of p.files || []) idb.del(f.id).catch(() => {});
        for (const c of convos) if (c.projectId === id) delete c.projectId;
        projects = projects.filter((x) => x.id !== id); saveConvos(); saveProjects(); renderProjList();
      });
      const host = el.querySelector('.pj-convs');
      if (host) for (const c of convs) { const r = document.createElement('div'); r.className = 'convrow' + (c.id === activeId ? ' active' : ''); r.innerHTML = '<div class="cmeta"><div class="ctitle">' + esc(c.title || tx('Samtal')) + '</div><div class="csub">' + esc(ago(c.ts)) + '</div></div>'; r.addEventListener('click', () => openConvo(c.id)); host.appendChild(r); }
    }
    const CLIP_PLUS = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>';
    $('s-proj').addEventListener('click', () => { openProjects(); closeSide(); });
    $('s-projn').textContent = projects.length || '';
    function ago(ts) { const s = (Date.now() - ts) / 1000; if (s < 60) return 'nyss'; if (s < 3600) return Math.floor(s / 60) + ' min sedan'; if (s < 86400) return Math.floor(s / 3600) + ' h sedan'; return Math.floor(s / 86400) + ' d sedan'; }
    function renderConvList() {
      const host = $('convlist'); host.innerHTML = '';
      const ordered = convos.slice().sort((a, b) => b.ts - a.ts);
      if (ordered.length === 1 && !ordered[0].messages.length) { host.innerHTML = '<div class="p-empty">Inga tidigare samtal än.<br>Skriv något till Falk så dyker de upp här.</div>'; return; }
      for (const c of ordered) {
        const row = document.createElement('div'); row.className = 'convrow' + (c.id === activeId ? ' active' : '');
        const preview = (MODE_LABEL[c.mode || 'fraga'] || 'Fråga') + ' · ' + (c.messages.length) + ' meddelanden · ' + ago(c.ts);
        row.innerHTML = '<span class="ci"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>'
          + '<div class="cmeta"><div class="ctitle">' + esc(c.title || 'Nytt samtal') + '</div><div class="csub">' + preview + '</div></div>'
          + '<button class="del" title="Ta bort samtal"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>';
        row.addEventListener('click', (e) => { if (e.target.closest('.del')) { e.stopPropagation(); row.classList.add('leaving'); setTimeout(() => deleteConvo(c.id), 380); } else openConvo(c.id); });
        host.appendChild(row);
      }
    }
    function renderMemList() {
      const list = memGet(); const host = $('mplist'); host.innerHTML = '';
      if (!list.length) { host.innerHTML = '<div class="p-empty">Falk har inga minnen om dig än.<br>Lägg till något själv nedan, eller berätta något i chatten.</div>'; return; }
      for (const m of list.slice().reverse()) {
        const row = document.createElement('div'); row.className = 'mprow';
        row.innerHTML = '<div class="mv">' + esc(m.text) + '</div>'
          + '<button class="ib edit" title="Ändra"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>'
          + '<button class="ib del" title="Ta bort"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>';
        const mv = row.querySelector('.mv');
        function beginEdit() {
          mv.setAttribute('contenteditable', 'true'); mv.focus();
          const r = document.createRange(); r.selectNodeContents(mv); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
        }
        function commit() { mv.removeAttribute('contenteditable'); const t = mv.textContent.trim(); if (t && t !== m.text) memEdit(m.id, t); else if (!t) { memDelById(m.id); } if (!t || t !== m.text) renderMemList(); }
        row.querySelector('.edit').addEventListener('click', beginEdit);
        mv.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); mv.blur(); } if (e.key === 'Escape') { mv.textContent = m.text; mv.blur(); } });
        mv.addEventListener('blur', commit);
        row.querySelector('.del').addEventListener('click', () => { row.classList.add('leaving'); setTimeout(() => { memDelById(m.id); }, 380); });
        host.appendChild(row);
      }
    }

    /* ── Inmatning ── */
    function autosize() { inp.style.height = 'auto'; inp.style.height = Math.min(120, inp.scrollHeight) + 'px'; }
    inp.addEventListener('input', () => { autosize(); showCmd(); });
    inp.addEventListener('keydown', (e) => {
      if (cmdVisible()) {
        const m = cmdMatches();
        if (e.key === 'ArrowDown') { e.preventDefault(); cmdSel = (cmdSel + 1) % m.length; showCmd(); return; }
        if (e.key === 'ArrowUp') { e.preventDefault(); cmdSel = (cmdSel - 1 + m.length) % m.length; showCmd(); return; }
        if (e.key === 'Escape') { hideCmd(); return; }
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); const c = m[cmdSel]; inp.value = ''; autosize(); hideCmd(); if (c) c.run(); return; }
        if (e.key === 'Tab') { e.preventDefault(); const c = m[cmdSel]; if (c) { inp.value = c.name + ' '; showCmd(); } return; }
      }
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
    inp.addEventListener('blur', () => setTimeout(hideCmd, 150));
    sendBtn.addEventListener('click', send);

    $('newchat').addEventListener('click', newConvo);
    $('convbtn').addEventListener('click', () => togglePanel('convpanel'));
    $('membtn').addEventListener('click', () => togglePanel('mempanel'));
    // Helskärm på/av — panelen täcker hela webbytan (skönare för långa rapporter).
    let kFull = false;
    function applyFull(f) {
      kFull = !!f;
      $('full-ic-open').style.display = kFull ? 'none' : '';
      $('full-ic-close').style.display = kFull ? '' : 'none';
      $('fullbtn').title = kFull ? 'Lämna helskärm' : 'Helskärm';
      document.body.classList.toggle('full', kFull);
    }
    $('fullbtn').addEventListener('click', () => { applyFull(!kFull); try { window.krypto.expand(kFull); } catch {} });
    $('convclose').addEventListener('click', closePanels);
    $('memclose').addEventListener('click', closePanels);
    $('conv-new').addEventListener('click', newConvo);
    $('memadd-btn').addEventListener('click', () => { const v = $('memadd-inp').value.trim(); if (v && memAdd(v)) { $('memadd-inp').value = ''; renderMemList(); } });
    $('memadd-inp').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); $('memadd-btn').click(); } });

    /* ── Sidomenyn ── */
    let myName = '';
    function dayGroup(ts) {
      const d = new Date(ts), t = new Date(); t.setHours(0, 0, 0, 0);
      const diff = (t - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000;
      return diff <= 0 ? 'I dag' : diff === 1 ? 'I går' : diff < 7 ? 'Senaste veckan' : diff < 30 ? 'Senaste 30 dagarna' : 'Äldre';
    }
    function renderSide() {
      const host = $('s-list'); if (!host) return;
      const q = ($('s-q').value || '').trim().toLowerCase();
      const list = convos.filter((c) => c.messages.length).sort((a, b) => b.ts - a.ts)
        .filter((c) => !q || (c.title || '').toLowerCase().includes(q) || c.messages.some((m) => (m.content || '').toLowerCase().includes(q)));
      host.innerHTML = '';
      if (!list.length) { host.innerHTML = '<div class="s-none">' + (q ? 'Inga samtal matchar.' : 'Dina samtal med Falk hamnar här.') + '</div>'; return; }
      let last = '';
      for (const c of list) {
        const g = dayGroup(c.ts);
        if (g !== last) { const l = document.createElement('div'); l.className = 's-lbl'; l.textContent = g; host.appendChild(l); last = g; }
        const b = document.createElement('button'); b.type = 'button'; b.className = 's-conv' + (c.id === activeId ? ' on' : '');
        b.innerHTML = '<span>' + esc(c.title || 'Nytt samtal') + '</span><i class="x" title="Ta bort samtal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></i>';
        b.addEventListener('click', (e) => { if (e.target.closest('.x')) { e.stopPropagation(); deleteConvo(c.id); return; } openConvo(c.id); closeSide(); });
        host.appendChild(b);
      }
    }
    function closeSide() { document.body.classList.remove('side-open'); }
    $('sidebtn').addEventListener('click', () => document.body.classList.add('side-open'));
    $('sideclose').addEventListener('click', closeSide);
    $('scrim').addEventListener('click', closeSide);
    $('s-new').addEventListener('click', () => { newConvo(); closeSide(); });
    $('s-mem').addEventListener('click', () => { togglePanel('mempanel', true); closeSide(); });
    $('s-q').addEventListener('input', renderSide);
    $('s-q').addEventListener('keydown', (e) => { if (e.key === 'Escape') { $('s-q').value = ''; renderSide(); } });
    const memN = () => { const n = memGet().length; $('s-memn').textContent = n ? n : ''; };
    const _ub = updateBadge; updateBadge = function () { _ub(); memN(); };
    try { window.krypto.me().then((r) => { myName = (r && r.name) || ''; if (!history.length) render(); }).catch(() => {}); } catch {}

    /* ── Start ── */
    loadConvos(); applyModeUI((activeConvo() && activeConvo().mode) || kMode); updateBadge(); updateConvTitle(); render(); renderSide();
    setTimeout(() => inp.focus(), 60);
  </script>
</body>
</html>
