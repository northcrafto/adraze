<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/48.png" alt="" width="24" height="24">
    <b>AdRaze</b>
  </header>

  <main>
    <p class="host" id="host">…</p>
    <button id="vaxla" class="vaxla" role="switch" aria-checked="true">
      <span class="spar"><span class="knopp"></span></span>
      <span id="lage">Skyddet är på</span>
    </button>
    <button id="kakor" class="vaxla vaxla-liten" role="switch" aria-checked="true">
      <span class="spar"><span class="knopp"></span></span>
      <span class="vaxla-text"><span id="kak-lage">Avvisar kakrutor</span><small id="kak-under">Bara nödvändiga kakor sparas</small></span>
    </button>

    <dl class="siffror">
      <div><dt id="natverk">0</dt><dd>reklam &amp; spårare</dd></div>
      <div><dt id="popups">0</dt><dd>popups</dd></div>
      <div><dt id="omdir">0</dt><dd>omdirigeringar</dd></div>
    </dl>
    <p class="not" id="not" hidden>Ladda om sidan för att ändringen ska gälla.</p>

    <a class="konto" id="konto" href="https://adraze.app/konto" target="_blank" rel="noopener">
      <span class="konto-text"><b id="konto-rubrik">Se allt AdRaze stoppat</b><span id="konto-under">Logga in och koppla tillägget</span></span>
      <span class="konto-pil" aria-hidden="true">→</span>
    </a>

    <a class="stod" href="https://donate.stripe.com/3cIaEZ87SgTxdPjgvk0sU06" target="_blank" rel="noopener">
      <span class="konto-text"><b>Stöd vårt team</b><span>Så att vi kan utveckla AdRaze för din skull</span></span>
      <span class="konto-pil" aria-hidden="true">→</span>
    </a>
  </main>

  <footer>
    <span id="totalt">Totalt 0 popups · 0 omdirigeringar · 0 kakrutor</span>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
