<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5ede1">
<title>Kanelbullar med kardemumma – Söndagsbak</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f5ede1; color: #2b2118; font: 17px/1.55 -apple-system, system-ui, sans-serif; }
  .topp { padding: 18px 20px 6px; font: italic 600 15px/1 Georgia, serif; color: #9a6a3a; }
  h1 { margin: 6px 20px 10px; font: 700 32px/1.1 Georgia, serif; letter-spacing: -.01em; }
  .fakta { display: flex; gap: 8px; margin: 0 20px 18px; }
  .fakta span { padding: 6px 11px; border-radius: 999px; background: #ead9c2; font-size: 13.5px; font-weight: 600; }
  .bild { margin: 0 20px 18px; height: 170px; border-radius: 18px; background: radial-gradient(circle at 30% 40%, #d9944f 0 34px, transparent 35px),
    radial-gradient(circle at 62% 55%, #c9813f 0 40px, transparent 41px), radial-gradient(circle at 82% 32%, #dd9a55 0 28px, transparent 29px), #b8743a; }
  h2 { margin: 0 20px 8px; font: 700 20px/1.2 Georgia, serif; }
  ul { margin: 0 20px 18px; padding: 0; list-style: none; }
  li { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #e3d3bd; }
  li b { font-weight: 600; }
</style>
</head>
<body>
<div class="topp">Söndagsbak</div>
<h1>Kanelbullar med kardemumma</h1>
<div class="fakta"><span>30 bullar</span><span>2 timmar</span><span>Lätt</span></div>
<div class="bild" role="img" aria-label="Nygräddade bullar"></div>
<h2>Det här behöver du</h2>
<ul>
  <li><span>Vetemjöl</span><b>13 dl</b></li>
  <li><span>Mjölk</span><b>5 dl</b></li>
  <li><span>Smör</span><b>150 g</b></li>
  <li><span>Socker</span><b>1 dl</b></li>
  <li><span>Kardemumma, stött</span><b>2 tsk</b></li>
  <li><span>Jäst</span><b>50 g</b></li>
</ul>
</body>
</html>
