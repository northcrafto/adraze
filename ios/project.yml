# XcodeGen-projektet för AdRaze på iPhone (iPad fungerar men är inte finslipad).
#
# Den här filen är sanningen. AdRaze.xcodeproj och Genererat/ (Info.plist) skapas av XcodeGen vid
# varje bygge (bygg-sim.sh kör `xcodegen generate`), redigeras aldrig för hand och checkas aldrig in.
#
# Ägare: Grund. Andra agenter ändrar inte här. Be Grund (se LASMIG.md).
#
# Så plockas filerna upp, utan att någon behöver ändra här:
#   App/**/*.swift              kompileras (utom under App/Webb, App/Regler och */Bunt)
#   App/**/*.xcassets           tillgångskataloger; namnen inuti måste vara unika i hela appen
#   App/<Modul>/Bunt/**         kopieras in i appen som <Modul>/**   (skriptfasen "Kopiera buntfiler")
#   App/Webb/**, App/Regler/**  kopieras in som Webb/** och Regler/** (samma skriptfas)
# Andra lösa filer under App/ (json, html, png, md …) kommer INTE med i appen. Lägg dem i Bunt/.
name: AdRaze
options:
  bundleIdPrefix: app.adraze
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: sv
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  AdRaze:
    type: application
    platform: iOS
    sources:
      - path: App
        includes:
          - "*.swift"
          - "**/*.swift"
          - "**/*.xcassets"
        excludes:
          - "Webb/**"
          - "Regler/**"
          - "**/Bunt/**"
    postBuildScripts:
      - name: Kopiera buntfiler
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        script: exec "${SRCROOT}/verktyg/kopiera-bunt.sh"
    info:
      path: Genererat/Info.plist
      properties:
        CFBundleDisplayName: AdRaze
        CFBundleDevelopmentRegion: sv
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        LSRequiresIPhoneOS: true
        # Startskärmen: gorillan mitt på startfärgen. Appens startbild (Gemensamt/Startbild.swift) ritar exakt samma
        # sak första rutan och öppnar sig sedan mot startsidan.
        UILaunchScreen:
          UIColorName: Startbakgrund
          UIImageName: Startgorilla
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # En webbläsare måste kunna visa http-sajter i webbvyerna. Gäller bara WKWebView, inte URLSession.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        # Avgörs när appen skickas in (del 3, 2.8: E2E-chatten använder systemets krypto).
        ITSAppUsesNonExemptEncryption: false
        # Bild-i-bild och AirPlay för videor på webbsidor, och ljud som spelar vidare i bakgrunden. Apples
        # "Configuring your app for media playback": utan bakgrundsläget Audio, AirPlay, and Picture in Picture
        # (audio) får appen inte använda bild-i-bild. Själva bild-i-bilden är otestad i simulatorn.
        UIBackgroundModes:
          - audio
        # Nedladdningar och självtesternas resultat syns i appen Filer (Documents/).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSMicrophoneUsageDescription: AdRaze använder mikrofonen när du ringer i chatten och när en webbplats du godkänner ber om den.
        NSCameraUsageDescription: AdRaze använder kameran för videosamtal, bilder i chatten och när en webbplats du godkänner ber om den.
        NSLocationWhenInUseUsageDescription: Webbplatser kan be om din position. AdRaze frågar dig först och delar den bara med sajter du godkänner.
        NSLocalNetworkUsageDescription: AdRaze behöver det lokala nätverket för att visa sidor på din router och andra enheter hemma.
        NSPhotoLibraryAddUsageDescription: AdRaze sparar bilder du själv väljer att spara från webben och chatten.
        NSFaceIDUsageDescription: AdRaze använder Face ID för att låsa upp dina sparade lösenord och Falk.
    settings:
      base:
        PRODUCT_NAME: AdRaze
        PRODUCT_BUNDLE_IDENTIFIER: app.adraze.browser
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        # Skriptfasen läser App/ och skriver in i appen; sandlådan för skript skulle stoppa det.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: NO
        DEVELOPMENT_TEAM: ""
schemes:
  AdRaze:
    build:
      targets:
        AdRaze: all
    run:
      config: Debug
