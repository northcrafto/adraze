<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "News"; src: url("assets/fonts/Newsreader.ttf") format("truetype"); font-weight: 200 800; }
      @font-face { font-family: "NewsI"; src: url("assets/fonts/Newsreader-Italic.ttf") format("truetype"); font-weight: 200 800; }
      @font-face { font-family: "InterB"; src: url("assets/fonts/Inter-Bold.otf") format("opentype"); font-weight: 700; }
      @font-face { font-family: "InterM"; src: url("assets/fonts/Inter-Medium.otf") format("opentype"); font-weight: 500; }
      @font-face { font-family: "InterK"; src: url("assets/fonts/InterDisplay-Black.otf") format("opentype"); font-weight: 900; }
      :root { --paper: #ede5d6; --ink: #1b1916; --or: #ff4b1f; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
      .scene { position: absolute; inset: 0; overflow: hidden; background: var(--paper); }
      svg.full { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
      /* Kornet: samma brus som förebildens .grain (samma filter, samma 300 px ruta, opacity .42, multiply), men i SVG:n.
         Multiply och opacity sitter på gruppen, klippet på rektangeln inuti. Med klipp och multiply på samma element
         ritar Chrome med GPU inte kornet alls (bara i mjukvara), och med klippet på gruppen blir multiply verkningslöst. */
      #grain { opacity: .42; mix-blend-mode: multiply; pointer-events: none; }
      /* Satt text: allt står som SVG-text så att baslinjen hamnar exakt där den ska. Storleksbyten görs med skala. */
      svg text { white-space: pre; }
      .news  { font: 500 250px "News", serif; letter-spacing: -0.02em; }
      .newsi { font: 500 250px "NewsI", serif; letter-spacing: -0.02em; }
      .n104  { font: 500 104px "News", serif; letter-spacing: -0.02em; }
      .n88   { font: 500 88px "News", serif; letter-spacing: -0.02em; }
      .ni88  { font: 500 88px "NewsI", serif; letter-spacing: -0.02em; }
      .k150  { font: 900 150px "InterK", sans-serif; letter-spacing: -0.035em; }
      .k64   { font: 900 64px "InterK", sans-serif; }
      .k56   { font: 900 56px "InterK", sans-serif; letter-spacing: -0.01em; }
      .b66   { font: 700 66px "InterB", sans-serif; }
      .m40   { font: 500 40px "InterM", sans-serif; letter-spacing: 0.14em; }
      .m22   { font: 500 22px "InterM", sans-serif; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="30">

      <!-- En enda bild som bygger om sig på taktslagen: 0 till 30 s, 96 slag per minut -->

        <svg id="v" class="full" viewBox="0 0 1920 1080">
          <defs>
            <clipPath id="kp1"><path id="kpp1" /></clipPath>
            <clipPath id="kp2"><path id="kpp2" /></clipPath>
            <clipPath id="kp3"><path id="kpp3" /></clipPath>
            <clipPath id="kp4"><path id="kpp4" /></clipPath>

            <clipPath id="kf1"><rect id="kfr1" x="230" y="320" width="0" height="150" /></clipPath>
            <clipPath id="kf2"><rect id="kfr2" x="230" y="470" width="0" height="150" /></clipPath>
            <clipPath id="kf3"><rect id="kfr3" x="230" y="620" width="0" height="150" /></clipPath>
            <clipPath id="kf4"><rect id="kfr4" x="230" y="770" width="0" height="150" /></clipPath>
            <!-- kornet: förebildens brus, en ruta på 300 x 300 som upprepas -->
            <filter id="kornf" filterUnits="userSpaceOnUse" x="0" y="0" width="300" height="300"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" /><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .3  0 0 0 .55 0" /></filter>
            <pattern id="korn" patternUnits="userSpaceOnUse" x="0" y="0" width="300" height="300"><rect width="300" height="300" filter="url(#kornf)" /></pattern>

          </defs>
          <g id="world">
            <rect x="-200" y="-200" width="2320" height="1480" fill="#ede5d6" />

            <!-- remsan: din sida -->

                <text id="t-your" class="news" fill="#1b1916">Your</text>

              <g clip-path="url(#kf2)"><text id="ft2" class="n104" fill="#1b1916">a browser for Mac and Linux</text></g>
              <g clip-path="url(#kf3)"><text id="ft3" class="n104" fill="#1b1916">layout and colors your way</text></g>

    <script>
/* ===== Gemensamma ritfunktioner för sajtvideorna. Klistras in i index.html före scenkoden. ===== */
const FPS = 30, DROP = 3;                                   // koket: ny pose var tredje bildruta = 10 poser per sekund
const step = (t) => Math.floor((t * FPS) / DROP);
// seedad hash, -1..1. Aldrig Math.random.
const H = (n, s) => { const x = Math.sin(n * 127.1 + (s || 1) * 311.7) * 43758.5453; return (x - Math.floor(x)) * 2 - 1; };
// mjuk bana genom punkter (kvadratisk mittpunktskedja), öppen eller sluten
function smooth(p, closed) {
  const n = p.length, f = (v) => v.toFixed(1);
  if (!closed) {
    let d = `M${f(p[0][0])} ${f(p[0][1])}`;
    for (let i = 1; i < n - 1; i++) { const a = p[i], b = p[i + 1]; d += ` Q${f(a[0])} ${f(a[1])} ${f((a[0] + b[0]) / 2)} ${f((a[1] + b[1]) / 2)}`; }
    return d + ` L${f(p[n - 1][0])} ${f(p[n - 1][1])}`;
  }
  let d = `M${f((p[0][0] + p[n - 1][0]) / 2)} ${f((p[0][1] + p[n - 1][1]) / 2)}`;
  for (let i = 0; i < n; i++) { const a = p[i], b = p[(i + 1) % n]; d += ` Q${f(a[0])} ${f(a[1])} ${f((a[0] + b[0]) / 2)} ${f((a[1] + b[1]) / 2)}`; }
  return d + 'Z';
}
// darr: flyttar varje punkt lite, olika för varje steg st
const jit = (p, seed, st, amp) => p.map((q, i) => [q[0] + H(st * 7 + i * 13, seed) * amp, q[1] + H(st * 7 + i * 13 + 5, seed + 3) * amp]);
// rektangel som punkter: hörnen dubblade så att kanterna håller sig raka
function rectPts(x, y, w, h, r) {
  r = r || 10; const o = [], C = [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
  const seg = (a, b, k) => { for (let i = 0; i < k; i++) o.push([a[0] + (b[0] - a[0]) * i / k, a[1] + (b[1] - a[1]) * i / k]); };
  const k = (len) => Math.max(2, Math.round(len / 90));
  for (let c = 0; c < 4; c++) { const a = C[c], b = C[(c + 1) % 4], len = Math.hypot(b[0] - a[0], b[1] - a[1]), ux = (b[0] - a[0]) / len, uy = (b[1] - a[1]) / len;
    o.push([a[0] + ux * r * .3, a[1] + uy * r * .3]); seg([a[0] + ux * r, a[1] + uy * r], [b[0] - ux * r, b[1] - uy * r], k(len)); o.push([b[0] - ux * r * .3, b[1] - uy * r * .3]); }
  return o;
}
// klick: ojämn cirkel
const blobPts = (cx, cy, r, seed, n, irr) => Array.from({ length: n }, (_, i) => { const a = i / n * Math.PI * 2, rr = r * (1 + H(i * 3 + 1, seed) * irr); return [cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]; });
const rot = (p, cx, cy, dg) => { const a = dg * Math.PI / 180, c = Math.cos(a), n = Math.sin(a); return p.map(([x, y]) => [cx + (x - cx) * c - (y - cy) * n, cy + (x - cx) * n + (y - cy) * c]); };
// loggans egen rektangel (tre punkter per kant). Bara till AD-lappen, så att den blir exakt som i loggan.
function tagRect(x, y, w, h, r) { const o = [], C = [[x, y], [x + w, y], [x + w, y + h], [x, y + h]]; for (let c = 0; c < 4; c++) { const a = C[c], b = C[(c + 1) % 4], L = Math.hypot(b[0] - a[0], b[1] - a[1]), ux = (b[0] - a[0]) / L, uy = (b[1] - a[1]) / L; o.push([a[0] + ux * r * .3, a[1] + uy * r * .3]); for (let i = 0; i < 3; i++) { const t = i / 2; o.push([a[0] + ux * r + (b[0] - a[0] - 2 * ux * r) * t, a[1] + uy * r + (b[1] - a[1] - 2 * uy * r) * t]); } o.push([b[0] - ux * r * .3, b[1] - uy * r * .3]); } return o; }

/* ===== Gorillan: lager i en ruta på 200 x 200, samma punkter som loggan (logo/nya/gorilla.html) =====
   pose: tag    true = gul AD-lapp i munnen (loggan), false = vanlig mun
         look   [x, y], -1..1: vart pupillerna tittar
         blink  0 eller 1
         brow   -1 hungrig/bestämd, 0 neutral, 1 glad/förvånad
         jaw    0..1 gap (bara utan lapp)
         cheeks 0..1 fulla kinder
         blob   false = utan orange klick
   Neutral pose med st = 1 ger exakt loggans banor. */
function gorilla(pose) {
  const P = Object.assign({ tag: true, look: [0, 0], blink: 0, brow: 0, jaw: 0, cheeks: 0, blob: true }, pose || {});
  const F = '#3a332d', A = '#c9b8a0', I = '#1b1916', O = '#ff4b1f', Y = '#ffd23e';
  const j = P.tag ? 0 : P.jaw, k = P.cheeks, up = Math.max(0, P.brow), dn = Math.max(0, -P.brow);
  const ex = P.look[0] * 4, ey = P.look[1] * 3;
  const L = [];
  L.push({ id: 'blob', hide: !P.blob, p: blobPts(100, 104, 92, 9, 16, .06), c: 1, fill: O, amp: 2.2 });
  L.push({ id: 'earL', p: blobPts(40, 106, 13, 2, 8, .06), c: 1, fill: F, w: 7, amp: 1 });
  L.push({ id: 'earR', p: blobPts(160, 106, 13, 3, 8, .06), c: 1, fill: F, w: 7, amp: 1 });
  L.push({ id: 'head', p: [[100, 30], [128, 38], [150, 60], [160, 92], [157, 126], [146, 152 + 5 * j], [124, 168 + 9 * j], [100, 173 + 10 * j], [76, 168 + 9 * j], [54, 152 + 5 * j], [43, 126], [40, 92], [50, 60], [72, 38]], c: 1, fill: F, w: 8, amp: 1.6 });
  L.push({ id: 'face', p: [[100, 72], [120, 66], [138, 76], [142, 94], [136, 110], [148 + 5 * k, 128], [143 + 4 * k, 150 + 4 * j], [124, 162 + 9 * j], [100, 165 + 10 * j], [76, 162 + 9 * j], [57 - 4 * k, 150 + 4 * j], [52 - 5 * k, 128], [64, 110], [58, 94], [62, 76], [80, 66]], c: 1, fill: A, w: 6, amp: 1.4 });
  L.push({ id: 'brow', p: [[62, 92 - 4 * up - 3 * dn], [80, 82 - 6 * up + 5 * dn], [100, 90 - 5 * up + 6 * dn], [120, 82 - 6 * up + 5 * dn], [138, 92 - 4 * up - 3 * dn]], w: 10, amp: 1 });
  if (P.blink > .5) {
    L.push({ id: 'eyeL', p: [[76, 103], [82, 104.5], [88, 103]], w: 5, amp: .6 });
    L.push({ id: 'eyeR', p: [[112, 103], [118, 104.5], [124, 103]], w: 5, amp: .6 });
  } else {
    L.push({ id: 'eyeL', p: blobPts(82 + ex, 102 + ey, 6, 1, 8, .08), c: 1, fill: I, amp: .6 });
    L.push({ id: 'eyeR', p: blobPts(118 + ex, 102 + ey, 6, 2, 8, .08), c: 1, fill: I, amp: .6 });
  }
  L.push({ id: 'nose', p: [[85, 128], [90, 114], [100, 111], [110, 114], [115, 128]], w: 6, amp: .8 });
  L.push({ id: 'nosL', p: blobPts(93, 127, 3.5, 4, 8, .08), c: 1, fill: I, amp: .6 });
  L.push({ id: 'nosR', p: blobPts(107, 127, 3.5, 5, 8, .08), c: 1, fill: I, amp: .6 });
  if (P.tag) L.push({ id: 'tag', p: rot(tagRect(70, 138, 62, 26, 5), 101, 151, -8), c: 1, fill: Y, w: 5, amp: .9 });
  else if (j < .08) L.push({ id: 'mouth', p: [[78, 147], [100, 152], [122, 147]], w: 6, amp: .8 });
  else L.push({ id: 'gap', p: [[80, 143], [100, 140], [120, 143], [125, 148 + 7 * j], [112, 154 + 13 * j], [100, 156 + 14 * j], [88, 154 + 13 * j], [75, 148 + 7 * j]], c: 1, fill: I, w: 5, amp: .8 });
  return L;
}
// Sätter upp gorillan i en <g> och ger tillbaka draw(pose, st). Anropa draw från en R-funktion varje bildruta.
function mountGorilla(g) {
  const NS = 'http://www.w3.org/2000/svg', el = {}; let txt = null;
  return function draw(pose, st) {
    const seen = {};
    gorilla(pose).forEach((l, idx) => {
      let e = el[l.id];
      if (!e) { e = el[l.id] = document.createElementNS(NS, 'path'); e.style.strokeLinecap = 'round'; e.style.strokeLinejoin = 'round'; g.appendChild(e); }
      seen[l.id] = 1;
      e.style.display = l.hide ? 'none' : '';
      e.setAttribute('d', smooth(jit(l.p, idx * 17 + 3, st, l.amp || 1.5), l.c));
      e.style.fill = l.fill || 'none';                     // stil, inte attribut: en CSS-regel kan annars vinna
      e.style.stroke = l.w ? '#1b1916' : 'none';
      e.style.strokeWidth = l.w || 0;
    });
    for (const id in el) if (!seen[id]) el[id].style.display = 'none';
    if (!txt) { txt = document.createElementNS(NS, 'text'); txt.textContent = 'AD'; txt.setAttribute('x', 101); txt.setAttribute('y', 159); txt.setAttribute('transform', 'rotate(-8 101 159)'); txt.setAttribute('text-anchor', 'middle'); txt.setAttribute('style', "font: 900 20px 'InterK', sans-serif; fill: #1b1916"); }
    if (seen.tag) g.appendChild(txt);                      // texten ska alltid ligga överst
    txt.style.display = seen.tag ? '' : 'none';
  };
}
/* ===== Slut på de gemensamma ritfunktionerna (mönstren görs per band nedan) ===== */

(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = (s) => document.querySelector(s);
  const D = 30, BT = 0.625;                                  // 30,0 s, 96 slag per minut
  const C = { paper: '#ede5d6', ink: '#1b1916', light: '#f4efe6', muted: '#8d8273', mutedT: '#7f7567', or: '#ff4b1f', sun: '#ffd23e', blue: '#5d7fa3', rose: '#f2a7b8', olive: '#5f6b45', night: '#151412', salmon: '#ff8e72', sheet: '#fbf7ef', mint: '#9fd3c7', lilac: '#c7b8f5' };

  // Typsnitten måste vara inlästa innan något mäts. Tidslinjen registreras sist i build().
  Promise.all(['500 250px News', '500 250px NewsI', '900 150px InterK', '700 66px InterB', '500 40px InterM'].map((f) => document.fonts.load(f, 'AdRaze Your page'))).then(build, build);

  function build() {
    /* ---------- små hjälpare ---------- */
    const EZ = {}, ez = (n) => EZ[n] || (EZ[n] = gsap.parseEase(n));
    const E = (n, p) => ez(n)(p);
    const cl = (v) => Math.max(0, Math.min(1, v));
    const seg = (t, a, d) => cl((t - a) / d);                // 0..1 över [a, a + d]
    const lerp = (a, b, p) => a + (b - a) * p;
    const bt = (k) => Math.floor(k * 18.75 + 0.49) / 30;     // slag k, avrundat till bildruta (halva rutor nedåt: bild före ljud)
    const f2 = (v) => v.toFixed(2);
    const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
    const mix = (a, b, p) => { const A = hex(a), B = hex(b); return `rgb(${Math.round(lerp(A[0], B[0], p))},${Math.round(lerp(A[1], B[1], p))},${Math.round(lerp(A[2], B[2], p))})`; };
    const mk = (tag, parent, attrs) => { const e = document.createElementNS(NS, tag); if (attrs) for (const a in attrs) e.setAttribute(a, attrs[a]); parent.appendChild(e); return e; };
    const ink = (p, fill, stroke, w) => { p.style.fill = fill || 'none'; p.style.stroke = stroke || 'none'; p.style.strokeWidth = w || 0; p.style.strokeLinecap = 'round'; p.style.strokeLinejoin = 'round'; return p; };
    const show = (e, on) => { e.style.display = on ? '' : 'none'; return on; };
    const R = [];                                            // allt som ritas per bildruta: rena funktioner av tiden

    // Spår: ett tal som funktion av tiden, byggt av segment. Ersätter tweens så att inget beror på i vilken ordning rutorna renderas.
    class Tr {
      constructor(v0) { this.v0 = v0; this.s = []; this.ok = false; }
      to(t, d, v, e) { this.s.push({ t, d: Math.max(d, 1e-4), b: v, e: ez(e || 'power2.out') }); this.ok = false; return this; }

      const rows = [1, 2, 3, 4].map((i) => ({ t: $('#ft' + i), r: $('#kfr' + i), h: ink($('#fh' + i), 'none', C.or, FW), v: ink($('#fv' + i), 'none', C.or, FW) }));
      R.push((t) => { if (!show(g, t >= ROWT[0] - 0.15 && t < FOLD[0] + 0.6)) return; const st = step(t);
        rows.forEach((Rw, i) => { const T = ROWT[i], by = ROWY[i] + rowDip(i, t), cy0 = by - 27;
          const dr = E('power2.out', seg(t, T - 0.1, 0.1)), up = E('back.out(3.2)', seg(t, T, 0.2));
          const fo = E('power2.in', seg(t, FOLD[i], 0.12)), fly = E('power2.inOut', seg(t, FOLD[i] + 0.06, 0.26));
          const pu = Math.sin(Math.PI * seg(t, LANDR[i], 0.3));                                         // gorillan landar på raden: plustecknet sväller
          // text: skrivs fram från plustecknet, fälls sedan ihop uppåt
          const wp = E('power3.out', seg(t, T + 0.05, 0.34));
          Rw.r.setAttribute('width', f2((M.rows[i] + 60) * wp));
          Rw.t.setAttribute('transform', `translate(${f2(RX - 26 * (1 - wp))} ${f2(by - 80)}) scale(1 ${(1 - fo).toFixed(4)}) translate(0 80)`);
          show(Rw.t, wp > 0 && fo < 1);
          // tecknet: först ett liggande streck, sedan reser sig stolpen. Till sist flyger strecket till adressknappen.
          if (!show(Rw.h, dr > 0 && fly < 1)) { show(Rw.v, false); return; }
          const k = (1 + 0.22 * pu) * (1 - 0.35 * fly), arm = FARM * k, w = FW * k;
          const cx = lerp(PXC, PILL[0], fly), cy = lerp(cy0, PILL[1], fly) - 90 * Math.sin(Math.PI * fly);
          const xa = cx - arm, xb = lerp(cx - arm, cx + arm, dr), armV = arm * up * (1 - E('power2.in', seg(t, FOLD[i], 0.08)));
          Rw.h.style.strokeWidth = w; Rw.h.setAttribute('d', smooth(jit([[xa, cy], [(xa + xb) / 2, cy], [xb, cy]], 900 + i * 3, st, 1.8), false));
          if (show(Rw.v, armV > 0.5)) { Rw.v.style.strokeWidth = w; Rw.v.setAttribute('d', smooth(jit([[cx, cy - armV], [cx, cy], [cx, cy + armV]], 901 + i * 3, st, 1.8), false)); }
        }); }); }

    /* ================= SLUTKORTET ================= */
    { const g = $('#endcard'), pill = ink($('#pill'), 'none', C.or, 124), url = $('#url'), small = $('#small');
      const WS = [0, 64, 88, 108, 124];
      R.push((t) => { if (!show(g, t >= ARR[0] + 0.02)) return; const ly = loopY(t);
        let L = 0, W = 0; for (let j = 0; j < 4; j++) { const e = E('back.out(2.6)', seg(t, ARR[j], 0.22)); L += 110 * e; W += (WS[j + 1] - WS[j]) * e; }
        const a = Math.max(0.5, (L - W) / 2), amp = 2 * (1 - seg(t, ARR[3], 0.3));
        pill.style.strokeWidth = Math.max(1, W);
        pill.setAttribute('d', smooth(jit([[PILL[0] - a, PILL[1] + ly], [PILL[0], PILL[1] + ly], [PILL[0] + a, PILL[1] + ly]], 950, step(t), amp), false));
        const us = E('back.out(2.4)', seg(t, ARR[3] + 0.05, 0.3));
        if (show(url, us > 0)) { url.style.opacity = cl(us * 3); url.setAttribute('transform', `translate(${PILL[0]} ${f2(PILL[1] + ly)}) scale(${lerp(0.6, 1, us).toFixed(3)}) translate(0 17)`); }
        const sp = seg(t, ARR[3] + 0.28, 0.32);
        if (show(small, sp > 0)) { small.style.opacity = cl(sp * 2); small.setAttribute('transform', `translate(962.8 ${f2(836 + 24 * (1 - E('power2.out', sp)) + ly)})`); } }); }
    { const g = $('#lock'), ls = [...g.children];
      R.push((t) => { if (!show(g, t >= tC - 0.02)) return; const p = E('power2.inOut', seg(t, tGlide, 0.5));
        g.setAttribute('transform', `translate(${f2(lerp(345, 777, p))} ${f2(lerp(222, 511, p) + loopY(t))}) scale(${lerp(1, 1.6, p).toFixed(4)})`);
        ls.forEach((L, j) => { const q = seg(t, tC - 0.02 + j * 0.05, 0.3); L.style.opacity = cl(q * 3); L.setAttribute('transform', `translate(${f2(M.ad[j])} ${f2(60 * (1 - E('back.out(2.4)', q)))})`); }); }); }

    /* ================= FARTSTRECK: tre bläckstreck där gorillan nyss stod, när den far upp ur bild ================= */
    { const g = $('#fart'), P = [0, 1, 2].map(() => ink(mk('path', g), 'none', C.ink, 7));
      const LE = [[tLeap, 1672, 214], [tC - 0.42, PERCH_X, PERCH_Y], [LANDR[0] - 0.4, LOCK_X, LOCK_Y], [tD, GRX[3], ROWY[3]]];
      R.push((t) => { let k = -1; LE.forEach(([T], i) => { if (t >= T + 0.033 && t < T + 0.2) k = i; });
        if (!show(g, k >= 0)) return; const [T, x, y] = LE[k], p = (t - T - 0.033) / 0.167, st = step(t);
        [-62, 0, 62].forEach((dx, j) => { const len = (j === 1 ? 150 : 100) * (1 - p), yb = y - 20 - (j === 1 ? 0 : 26) - 170 * p;
          P[j].setAttribute('d', smooth(jit([[x + dx, yb], [x + dx * 0.96, yb - len / 2], [x + dx * 0.92, yb - len]], 980 + j, st, 2), false)); }); }); }

    /* ================= GORILLAN: ritas ================= */
    { const wrap = $('#g-wrap'), drawG = mountGorilla($('#g-rig'));
      const dipG = (t) => { let d = 0; for (let i = 0; i < 4; i++) d += rowDip(i, t); return d; };   // står på raden: gungar med den
      R.push((t) => { const k = G.sz.at(t) / 200, fx = G.fx.at(t), fy = G.fy.at(t) + loopY(t) + dipG(t);
        if (!show(wrap, fy > camTop(t) - 4 && t >= tPeek - 0.05)) return;
        drawG({ tag: true, look: [G.lx.at(t), G.ly.at(t)], blink: G.bl.at(t), brow: G.br.at(t) }, step(t));
        // tillplattning utgår från underkanten (100, 196) i ritrutan
        wrap.setAttribute('transform', `translate(${f2(fx)} ${f2(fy)}) rotate(${f2(G.rot.at(t))}) scale(${(k * G.sx.at(t)).toFixed(4)} ${(k * G.sy.at(t)).toFixed(4)}) translate(-100 -196)`); }); }

    /* ================= KORNET: bara på papperet, aldrig på banden ================= */
    // Klippet ritas i världens koordinater och får världens transform (skak, knuff och kamera), så att det följer bandets kant exakt.
    // Själva kornet ligger utanför världen och står still.
    { const kp = $('#kkp'); R.push(() => { kp.setAttribute('d', paperEdge ? `${paperEdge} L2010 -500 L-90 -500Z` : 'M-300 -500H2220V1380H-300Z'); kp.setAttribute('transform', worldTr); }); }

    /* ---------- en enda uppdatering per bildruta ---------- */
    gsap.config({ force3D: false });
    const tl = gsap.timeline({ paused: true });
    const klocka = { t: 0 };
    tl.to(klocka, { t: D, duration: D, ease: 'none' }, 0);
    const render = (t) => { for (const f of R) f(t); };
    tl.eventCallback('onUpdate', () => render(tl.time()));
    render(0);
    window.__minus = { render, bt, M };
    window.__timelines = window.__timelines || {};
    window.__timelines['main'] = tl;
  }
})();
