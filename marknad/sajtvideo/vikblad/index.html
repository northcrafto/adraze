    <script>
      /* ===== Gemensamma ritfunktioner för sajtvideorna. Klistras in i index.html före scenkoden. ===== */
      const FPS = 30, DROP = 3;                                   // koket: ny pose var tredje bildruta = 10 poser per sekund
      const step = (t) => Math.floor((t * FPS) / DROP);
      // seedad hash, -1..1. Aldrig Math.random.
      const H = (n, s) => { const x = Math.sin(n * 127.1 + (s || 1) * 311.7) * 43758.5453; return (x - Math.floor(x)) * 2 - 1; };
      // mjuk bana genom punkter (kvadratisk mittpunktskedja), öppen eller sluten
      function smooth(p, closed) {
        const n = p.length, f = (v) => v.toFixed(1);
        if (!closed) {
          let d = `M${f(p[0][0])} ${f(p[0][1])}`;
          for (let i = 1; i < n - 1; i++) { const a = p[i], b = p[i + 1]; d += ` Q${f(a[0])} ${f(a[1])} ${f((a[0] + b[0]) / 2)} ${f((a[1] + b[1]) / 2)}`; }
          return d + ` L${f(p[n - 1][0])} ${f(p[n - 1][1])}`;
        }
        let d = `M${f((p[0][0] + p[n - 1][0]) / 2)} ${f((p[0][1] + p[n - 1][1]) / 2)}`;
        for (let i = 0; i < n; i++) { const a = p[i], b = p[(i + 1) % n]; d += ` Q${f(a[0])} ${f(a[1])} ${f((a[0] + b[0]) / 2)} ${f((a[1] + b[1]) / 2)}`; }
        return d + 'Z';
      }
      // darr: flyttar varje punkt lite, olika för varje steg st
      const jit = (p, seed, st, amp) => p.map((q, i) => [q[0] + H(st * 7 + i * 13, seed) * amp, q[1] + H(st * 7 + i * 13 + 5, seed + 3) * amp]);
      // rektangel som punkter: hörnen dubblade så att kanterna håller sig raka
      function rectPts(x, y, w, h, r) {
        r = r || 10; const o = [], C = [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
        const seg = (a, b, k) => { for (let i = 0; i < k; i++) o.push([a[0] + (b[0] - a[0]) * i / k, a[1] + (b[1] - a[1]) * i / k]); };
        const k = (len) => Math.max(2, Math.round(len / 90));
        for (let c = 0; c < 4; c++) { const a = C[c], b = C[(c + 1) % 4], len = Math.hypot(b[0] - a[0], b[1] - a[1]), ux = (b[0] - a[0]) / len, uy = (b[1] - a[1]) / len;
          o.push([a[0] + ux * r * .3, a[1] + uy * r * .3]); seg([a[0] + ux * r, a[1] + uy * r], [b[0] - ux * r, b[1] - uy * r], k(len)); o.push([b[0] - ux * r * .3, b[1] - uy * r * .3]); }
        return o;
      }
      // klick: ojämn cirkel
      const blobPts = (cx, cy, r, seed, n, irr) => Array.from({ length: n }, (_, i) => { const a = i / n * Math.PI * 2, rr = r * (1 + H(i * 3 + 1, seed) * irr); return [cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]; });
      const rot = (p, cx, cy, dg) => { const a = dg * Math.PI / 180, c = Math.cos(a), n = Math.sin(a); return p.map(([x, y]) => [cx + (x - cx) * c - (y - cy) * n, cy + (x - cx) * n + (y - cy) * c]); };
      // loggans egen rektangel (tre punkter per kant). Bara till AD-lappen, så att den blir exakt som i loggan.
      function tagRect(x, y, w, h, r) { const o = [], C = [[x, y], [x + w, y], [x + w, y + h], [x, y + h]]; for (let c = 0; c < 4; c++) { const a = C[c], b = C[(c + 1) % 4], L = Math.hypot(b[0] - a[0], b[1] - a[1]), ux = (b[0] - a[0]) / L, uy = (b[1] - a[1]) / L; o.push([a[0] + ux * r * .3, a[1] + uy * r * .3]); for (let i = 0; i < 3; i++) { const t = i / 2; o.push([a[0] + ux * r + (b[0] - a[0] - 2 * ux * r) * t, a[1] + uy * r + (b[1] - a[1] - 2 * uy * r) * t]); } o.push([b[0] - ux * r * .3, b[1] - uy * r * .3]); } return o; }

      /* ===== Gorillan: lager i en ruta på 200 x 200, samma punkter som loggan (logo/nya/gorilla.html) =====
         pose: tag    true = gul AD-lapp i munnen (loggan), false = vanlig mun
               look   [x, y], -1..1: vart pupillerna tittar
               blink  0 eller 1
               brow   -1 hungrig/bestämd, 0 neutral, 1 glad/förvånad
               jaw    0..1 gap (bara utan lapp)
               cheeks 0..1 fulla kinder
               blob   false = utan orange klick
         Neutral pose med st = 1 ger exakt loggans banor. */
      function gorilla(pose) {
        const P = Object.assign({ tag: true, look: [0, 0], blink: 0, brow: 0, jaw: 0, cheeks: 0, blob: true }, pose || {});
        const F = '#3a332d', A = '#c9b8a0', I = '#1b1916', O = '#ff4b1f', Y = '#ffd23e';
        const j = P.tag ? 0 : P.jaw, k = P.cheeks, up = Math.max(0, P.brow), dn = Math.max(0, -P.brow);
        const ex = P.look[0] * 4, ey = P.look[1] * 3;
        const L = [];
        L.push({ id: 'blob', hide: !P.blob, p: blobPts(100, 104, 92, 9, 16, .06), c: 1, fill: O, amp: 2.2 });
        L.push({ id: 'earL', p: blobPts(40, 106, 13, 2, 8, .06), c: 1, fill: F, w: 7, amp: 1 });
        L.push({ id: 'earR', p: blobPts(160, 106, 13, 3, 8, .06), c: 1, fill: F, w: 7, amp: 1 });
        L.push({ id: 'head', p: [[100, 30], [128, 38], [150, 60], [160, 92], [157, 126], [146, 152 + 5 * j], [124, 168 + 9 * j], [100, 173 + 10 * j], [76, 168 + 9 * j], [54, 152 + 5 * j], [43, 126], [40, 92], [50, 60], [72, 38]], c: 1, fill: F, w: 8, amp: 1.6 });
        L.push({ id: 'face', p: [[100, 72], [120, 66], [138, 76], [142, 94], [136, 110], [148 + 5 * k, 128], [143 + 4 * k, 150 + 4 * j], [124, 162 + 9 * j], [100, 165 + 10 * j], [76, 162 + 9 * j], [57 - 4 * k, 150 + 4 * j], [52 - 5 * k, 128], [64, 110], [58, 94], [62, 76], [80, 66]], c: 1, fill: A, w: 6, amp: 1.4 });
        L.push({ id: 'brow', p: [[62, 92 - 4 * up - 3 * dn], [80, 82 - 6 * up + 5 * dn], [100, 90 - 5 * up + 6 * dn], [120, 82 - 6 * up + 5 * dn], [138, 92 - 4 * up - 3 * dn]], w: 10, amp: 1 });
        if (P.blink > .5) {
          L.push({ id: 'eyeL', p: [[76, 103], [82, 104.5], [88, 103]], w: 5, amp: .6 });
          L.push({ id: 'eyeR', p: [[112, 103], [118, 104.5], [124, 103]], w: 5, amp: .6 });
        } else {
          L.push({ id: 'eyeL', p: blobPts(82 + ex, 102 + ey, 6, 1, 8, .08), c: 1, fill: I, amp: .6 });
          L.push({ id: 'eyeR', p: blobPts(118 + ex, 102 + ey, 6, 2, 8, .08), c: 1, fill: I, amp: .6 });
        }
        L.push({ id: 'nose', p: [[85, 128], [90, 114], [100, 111], [110, 114], [115, 128]], w: 6, amp: .8 });
        L.push({ id: 'nosL', p: blobPts(93, 127, 3.5, 4, 8, .08), c: 1, fill: I, amp: .6 });
        L.push({ id: 'nosR', p: blobPts(107, 127, 3.5, 5, 8, .08), c: 1, fill: I, amp: .6 });
        if (P.tag) L.push({ id: 'tag', p: rot(tagRect(70, 138, 62, 26, 5), 101, 151, -8), c: 1, fill: Y, w: 5, amp: .9 });
        else if (j < .08) L.push({ id: 'mouth', p: [[78, 147], [100, 152], [122, 147]], w: 6, amp: .8 });
        else L.push({ id: 'gap', p: [[80, 143], [100, 140], [120, 143], [125, 148 + 7 * j], [112, 154 + 13 * j], [100, 156 + 14 * j], [88, 154 + 13 * j], [75, 148 + 7 * j]], c: 1, fill: I, w: 5, amp: .8 });
        return L;

          tl.to(K4, { p: 0, duration: .5, ease: 'power2.inOut' }, 27.1);
          // 1,10 gånger: allt i bilden ryms (kortets mening går till x 1464, knappen slutar på y 518)
          kamera($('#kam4'), K4, { x: 0, y: 0, w: 1620 }, { x: 30, y: 4, w: 1470 });
          // orange penna under appens egna ord (bildens punkter): Open, not spying. och sedan they know you can see the history.
          const penna = (el, pts, seed) => R.push((t) => { if (!syns[4]) return; el.setAttribute('d', smooth(jit(pts.map(([x, y]) => [(x - K4.x) * K4.s, (y - K4.y) * K4.s]), seed, step(t), 1.6), false)); el.style.strokeWidth = 9 * K4.s; });
          penna($('#u4'), [[107, 250.5], [224, 248.5], [342, 251]], 91);
          penna($('#u4b'), [[1106, 385.5], [1286, 383.5], [1467, 386.5]], 92);
          penna($('#u4c'), [[758, 427.5], [808, 426], [861, 428.5]], 93);
          draw($('#u4'), 25.5, .6, 'power2.inOut');
          draw($('#u4b'), 26.3, .42, 'power2.in');
          draw($('#u4c'), 26.72, .2, 'power2.out');

          // ================= Gorillan =================
          const drawG = mountGorilla($('#g-rig')), gw = $('#g-wrap');
          const G = { x: PLATS.a[0], y: PLATS.a[1], size: PLATS.a[2], dx: 0, dy: 0, sx: 1, sy: 1, rot: 0, lx: .9, ly: .2, blink: 0, brow: .6 };
          // Hoppet över skarven, från slutkortets plats till ramens hörn: EN funktion av u (u = t i början, u = t - D i slutet)
          const AVSTAMP = -.4, LANDNING = .375;
          const flyg = (u) => { const p = (u - AVSTAMP) / (LANDNING - AVSTAMP), a = PLATS.slut, b = PLATS.a, s = Math.sin(Math.PI * p);
            return { x: a[0] + (b[0] - a[0]) * p, y: a[1] + (b[1] - a[1]) * p - 120 * s, size: a[2] + (b[2] - a[2]) * p, rot: 10 * s, sx: 1 - .04 * s, sy: 1 + .06 * s }; };
          R.push((t) => {
            let x = G.x + G.dx, y = G.y + G.dy, size = G.size, r = G.rot, sx = G.sx, sy = G.sy, lx = G.lx, ly = G.ly, brow = G.brow, blink = G.blink;
            const u = t < LANDNING ? t : (t >= D + AVSTAMP ? t - D : null);
            if (u !== null) { const f = flyg(u); x = f.x; y = f.y; size = f.size; r = f.rot; sx = f.sx; sy = f.sy; lx = .9; ly = .2; brow = .6; blink = 0; }
            drawG({ tag: true, look: [lx, ly], blink, brow }, step(t));
            const k = size / 200;                                  // tillplattning och lutning utgår från underkanten (100, 196) i ritrutan
            gw.setAttribute('transform', `translate(${(x + 100 * k).toFixed(2)} ${(y + 196 * k).toFixed(2)}) rotate(${r.toFixed(2)}) scale(${(k * sx).toFixed(4)} ${(k * sy).toFixed(4)}) translate(-100 -196)`);
            gw.style.display = y < -size - 20 ? 'none' : '';
          });
          const titta = (at, lx, ly, dur) => tl.to(G, { lx, ly, duration: dur || .1, ease: 'power2.out' }, at);
          const blinka = (at) => { tl.set(G, { blink: 1 }, at); tl.set(G, { blink: 0 }, at + .1); };
          const bryn = (at, v) => { tl.to(G, { brow: v, duration: .12, ease: 'power2.out' }, at); tl.to(G, { sy: .93, sx: 1.05, duration: .06 }, at); tl.to(G, { sy: 1, sx: 1, duration: .24, ease: 'back.out(2.6)' }, at + .06); };
          const nicka = (at) => { tl.to(G, { dy: 13, duration: .07, ease: 'power2.out' }, at); tl.to(G, { dy: 0, duration: .2, ease: 'back.out(2.4)' }, at + .07); };
          const landa = (at) => { tl.to(G, { sx: 1.14, sy: .86, duration: .06, ease: 'power2.out' }, at); tl.to(G, { sx: 1, sy: 1, duration: .26, ease: 'back.out(2.4)' }, at + .06); };
          // Stångning: blicken mot raden, bestämd min, sats bakåt åt höger (0,2 s) och så huvudet åt vänster in i radens
          // sista ord. Ordet knuffas undan och fjädrar tillbaka, tre bläckstreck vid träffen, och bladet far iväg åt vänster
          // (samma håll som raden glider) med full fart redan bildrutan efter träffen. Gorillan hoppar med och landar när bladet ligger plant.
          const TRAFF = [];
          function stanga(at, ord) {
            titta(at - .44, -1, .15);
            tl.to(G, { brow: -1, duration: .1, ease: 'power2.out' }, at - .4);
            tl.to(G, { dx: 26, rot: 9, sx: .95, sy: 1.05, duration: .2, ease: 'power2.out' }, at - .3);
            tl.to(G, { dx: -46, rot: -14, sx: 1, sy: 1, duration: .08, ease: 'power3.in' }, at - .08);
            tl.to(G, { sx: .88, sy: 1.1, duration: .04, ease: 'power2.out' }, at);          // trycks ihop mot ordet
            tl.to(G, { dx: 0, rot: 0, duration: .3, ease: 'power2.out' }, at + .04);
            tl.to(G, { brow: 0, duration: .15 }, at + .5);
            tl.to(G, { sy: 1.07, sx: .95, duration: .08 }, at + .04);
            tl.fromTo(G, { y: PLATS.a[1] }, { y: PLATS.a[1] - 84, duration: .25, ease: 'power2.out', immediateRender: false }, at);
            tl.to(G, { y: PLATS.a[1], duration: .25, ease: 'power2.in' }, at + .25);
            landa(at + .5);
            gsap.set(ord, { transformOrigin: '100% 80%' });
            tl.to(ord, { x: -30, rotation: -12, duration: .05, ease: 'power2.out' }, at);
            tl.to(ord, { x: 0, rotation: 0, duration: .5, ease: 'elastic.out(1.1, .35)' }, at + .05);
            TRAFF.push(at);
          }
          // bläckstrecken vid träffen: tre korta streck som skjuts ut uppåt, ovanför punkten där huvudet möter ordet
          { const B = Array.from($('#bang').children), C = [1590, 90], V3 = [-120, -92, -64], N = 5;      // uppåt, fritt från ordets uppstaplar (y 56) och gorillan
            R.push((t) => { let k = -1; for (const t0 of TRAFF) { const f = Math.round((t - t0) * FPS); if (f >= 0 && f < N) k = f; }
              $('#bang').style.display = k < 0 ? 'none' : '';
              if (k < 0) return;
              const q = k / N, r0 = 50 + 10 * q, r1 = 76 + 16 * q;
              B.forEach((p, i) => { const a = V3[i] * Math.PI / 180, j = H(k * 5 + i, 77) * 3;
                p.setAttribute('d', `M${(C[0] + Math.cos(a) * r0 + j).toFixed(1)} ${(C[1] + Math.sin(a) * r0).toFixed(1)} L${(C[0] + Math.cos(a) * r1).toFixed(1)} ${(C[1] + Math.sin(a) * r1 + j).toFixed(1)}`);
                p.style.opacity = 1 - .5 * q; }); }); }

          landa(LANDNING);
          tl.to(G, { brow: 0, duration: .2 }, .7);
          // blad 1: ner i bilden, med kameran ner till räknaren, ögonbrynen upp när ringen sluts runt 47, sedan oss
          titta(1.0, -.7, .8, .14);
          titta(2.2, -1, 1, .12);
          bryn(3.58, 1);
          titta(4.3, -.75, 1, .12);
          blinka(4.95);
          titta(5.3, 0, 0, .14); nicka(5.36);
          titta(5.9, -.5, .5); tl.to(G, { brow: 0, duration: .15 }, 6.0);
          stanga(6.75, $('#r2 .w:last-child'));
          // blad 2
          titta(7.42, -1, .7, .12);
          LK.forEach((t0, i) => { if (i) nicka(t0); });
          titta(13.55, -.6, 1, .12);
          titta(15.15, -1, -.3, .12); bryn(15.62, .7); blinka(15.4);
          stanga(16.5, $('#r3 .w:last-child'));
          // blad 3: remsan, meningen, bytet
          titta(17.2, -1, -.25, .12);
          titta(17.62, -.8, 1, .1); blinka(17.75);
          tl.fromTo(G, { lx: -.95 }, { lx: -.55, duration: 1.2, ease: 'none', immediateRender: false }, 18.0);          // ögonen följer orden
          titta(19.52, -.4, 1, .1);
          titta(20.27, -1, .5, .08); tl.to(G, { brow: 1, duration: .1, ease: 'power2.out' }, 20.27);
          tl.to(G, { dy: -24, sy: 1.06, sx: .96, duration: .09, ease: 'power2.out' }, 20.27); tl.to(G, { dy: 0, duration: .14, ease: 'power2.in' }, 20.36); landa(20.5);   // hoppar till
          titta(21.0, -.45, 1, .12); titta(21.55, -1, .45, .14); titta(22.5, -.5, 1, .14); titta(23.25, 0, 0, .14); tl.to(G, { brow: .3, duration: .15 }, 23.25); blinka(23.55);
          stanga(24.0, $('#r5 .w:last-child'));
          // blad 4
          titta(24.7, -.8, .8, .12); titta(25.38, -1, .6, .1); tl.to(G, { lx: -.6, duration: .6, ease: 'none' }, 25.5); bryn(26.12, .7);
          titta(26.3, -.45, 1, .12); nicka(26.95);
          tl.to(G, { brow: 0, duration: .15 }, 27.2); titta(27.75, 0, 0, .14); blinka(28.4);
          // 29,25: tar sats och hoppar rakt upp ur bild
          titta(29.02, 0, -1); tl.to(G, { sy: .86, sx: 1.1, duration: .1, ease: 'power2.out' }, 29.15);
          tl.to(G, { sy: 1.08, sx: .95, duration: .06 }, 29.25); tl.to(G, { y: -520, duration: .32, ease: 'power1.out' }, 29.25);
          // 31,50: faller ner på sin plats på omslaget, 440 px, och är loggan punkt för punkt
          tl.set(G, { x: PLATS.slut[0], size: PLATS.slut[2], sx: 1, sy: 1, lx: 0, ly: 0, brow: 0, dx: 0, dy: 0, rot: 0 }, 30.9);
          tl.fromTo(G, { y: -560 }, { y: PLATS.slut[1], duration: .22, ease: 'power2.in', immediateRender: false }, 31.28);
          landa(31.5);
          blinka(33.5);
          // 35,45: blicken först, hukar, skjuter ifrån 35,60 (därefter tar flyg(u) över)
          titta(35.3, .9, .2, .1); tl.to(G, { brow: .6, duration: .1 }, 35.4);
          tl.to(G, { sy: .88, sx: 1.08, duration: .12, ease: 'power2.out' }, 35.45);

          // en enda uppdatering per bildruta, sist i skriptet
          tl.eventCallback('onUpdate', () => { const t = tl.time(); for (const f of R) f(t); });
          R.forEach((f) => f(0));
          tl.set({}, {}, D);
          window.__timelines = window.__timelines || {};
          window.__timelines['main'] = tl;
        });
      })();
